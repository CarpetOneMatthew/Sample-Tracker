/* Fills Expected arrival with an estimate — this supplier's median
   lead time, or with no history yet, the median across all suppliers —
   and says where it came from. A date you type (the rep's) wins and is
   never overwritten. Left blank, the sample is flagged for a chase
   CFG.noEtaDays after it was ordered (isOverdue). */
function updateEta(idp){
  const hint=document.getElementById(idp+'-eta'),inp=document.getElementById(idp+'-etad');
  if(!hint)return;
  const sid=val(idp+'-sup');
  if(!sid){if(inp&&!etaTouched[idp])inp.value='';hint.textContent='Pick a supplier to see the estimated arrival.';return;}
  const e=etaEstimate(sid,val(idp+'-date')||today());
  if(inp&&!etaTouched[idp])inp.value=e.date;
  const own=' Change it if the rep gave you a date.';
  if(e.basis==='supplier')hint.innerHTML='Estimated arrival ~ <b>'+nice(e.date)+'</b> (median '+e.median+' days over '+e.count+' orders'+(e.median>=CFG.slowDays?' — <b>this supplier runs slow</b>':'')+').'+own;
  else if(e.basis==='all')hint.innerHTML='No history with this supplier yet — <b>'+nice(e.date)+'</b> is the median across all suppliers ('+e.median+' days).'+own;
  else hint.textContent='No history to estimate from yet — enter the rep’s date, or leave it blank and it’s flagged for a chase after '+CFG.noEtaDays+' days.';
}
function etaEstimate(sid,od){
  const st=supStats(sid);
  if(st.median!=null)return {date:addDays(od,st.median),basis:'supplier',median:st.median,count:st.leadCount};
  const all=median(DB.lines.filter(l=>!isExcluded(l)&&l['Date Ordered']&&l['Date Arrived'])
    .map(l=>dDiff(l['Date Ordered'],l['Date Arrived'])).filter(n=>n>=0));
  if(all!=null)return {date:addDays(od,all),basis:'all',median:all};
  return {date:'',basis:null};
}
/* "Who do we order Altro through?" answered under the Manufacturer
   field: every supplier whose tags list that name (exact match — the
   autocomplete keeps spellings in line). Tapping one picks it. If the
   chosen supplier already carries it, only the alternatives are named,
   and nothing shows when it's the only one. */
function carryHint(idp){
  const el=document.getElementById(idp+'-carry');if(!el)return;
  const m=val(idp+'-mfr').toLowerCase();
  const sid=val(idp+'-sup');
  const who=m?DB.suppliers.filter(s=>supTags(s).some(t=>t.toLowerCase()===m)).sort((a,b)=>a.Name.localeCompare(b.Name)):[];
  const others=who.filter(s=>s.ID!==sid);
  el.innerHTML=others.length?(others.length<who.length?'Also carried by ':'Carried by ')+
    others.map(s=>'<a href="#" onclick="pickCarrier(\''+idp+'\',\''+s.ID+'\');return false">'+esc(s.Name)+'</a>').join(' · '):'';
}
function pickCarrier(idp,sid){document.getElementById(idp+'-sup').value=sid;lineSupChanged(idp);}
function readLineForm(idp,pid){

    Product:prod,Manufacturer:val(idp+'-mfr'),SKU:val(idp+'-sku'),

}

/* editorRaw, validated, with status and dates kept from contradicting
   each other. Null (after saying why) if it can't be saved. */
function readEditor(){
  const v=editorRaw();
  if(!v.Product){toast('Give the sample a product name',true);return null;}
  if(v.Status==='Ordered'){v['Date Arrived']='';v['Date Delivered']='';v.Accuracy='';}
  if(v.Status==='Arrived'){v['Date Delivered']='';if(!v['Date Arrived'])v['Date Arrived']=today();}
  if(v.Status==='Delivered'){if(!v['Date Arrived'])v['Date Arrived']=v['Date Ordered']||today();if(!v['Date Delivered'])v['Date Delivered']=today();}
  if(v['Date Ordered']&&v['Date Arrived']&&v['Date Arrived']<v['Date Ordered']){toast('Arrival cannot be before the order date',true);return null;}
  if(v['Date Arrived']&&v['Date Delivered']&&v['Date Delivered']<v['Date Arrived']){toast('Hand-off cannot be before arrival',true);return null;}
  return v;
}

/* Tag editor. Enter or a comma turns what's typed into a chip, and so
   does picking a suggestion; Backspace in an empty field takes the last
   chip back to fix. Text still sitting in the field when you save is
   kept, so a tag is never lost for want of pressing Enter. */
function tagField(){
  return '<div class="tagedit" onclick="if(event.target===this)document.getElementById(\'sf-tag-in\').focus()">'+
    tagDraft.map((t,i)=>'<span class="tag">'+esc(t)+'<button type="button" class="tagx" aria-label="Remove '+esc(t)+'" '+

      'oninput="tagInput(event)" onkeydown="tagKey(event)" onblur="tagBlur()"></div>'+
    '<datalist id="sf-tag-list">'+nameOptions(knownNames(editSupId).filter(t=>!hasTag(t)))+'</datalist>';

function hasTag(t){return tagDraft.some(x=>x.toLowerCase()===t.toLowerCase());}
function addTags(txt){parseTags(txt).forEach(t=>{if(!hasTag(t))tagDraft.push(t);});}
/* redraws just the tag field; pass text to leave in it (and focus it).
   Swapping out a focused input fires blur — tagRedraw stops that blur
   committing the half-typed text as a tag. */
let tagRedraw=false;
function drawTags(keep){
  tagRedraw=true;
  document.getElementById('sf-tags').innerHTML=tagField();
  tagRedraw=false;
  const el=document.getElementById('sf-tag-in');
  if(keep!=null){el.value=keep;el.focus();}

function tagInput(e){
  const v=e.target.value;
  if(v.indexOf(',')!==-1){                              /* typed or pasted a comma */
    const parts=v.split(','),rest=parts.pop();
    addTags(parts.join(','));drawTags(rest.trimStart());
  }else if((!e.inputType||e.inputType==='insertReplacementText')&&
           knownNames('').some(t=>t.toLowerCase()===v.trim().toLowerCase())){
    addTags(v);drawTags('');                            /* picked from the suggestions */
  }
}
function tagKey(e){
  const el=e.target;
  if(e.key==='Enter'){e.preventDefault();if(el.value.trim()){addTags(el.value);drawTags('');}}
  else if(e.key==='Backspace'&&!el.value&&tagDraft.length){e.preventDefault();drawTags(tagDraft.pop());}
}
function tagBlur(){

/* Near-duplicates — "Metro Wallcoverins" beside "Metro Wallcoverings",
   "Mohawk" beside "Mohawk Group" — caught while the name is typed, not
   after samples have piled up under both. Compares letters and digits
   only: the same name, one the start of the other (5+ characters), or
   within two typos (6+ characters). */
function normName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function editDistance(a,b){
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
function nearName(a,b){
  a=normName(a);b=normName(b);
  if(!a||!b)return false;
  if(a===b)return true;
  const n=Math.min(a.length,b.length);
  if(n>=5&&(a.indexOf(b)===0||b.indexOf(a)===0))return true;
  return n>=6&&Math.abs(a.length-b.length)<=2&&editDistance(a,b)<=2;
}
function similarSuppliers(name){return DB.suppliers.filter(s=>s.ID!==editSupId&&nearName(s.Name,name));}
function dupHint(){
  const el=document.getElementById('sf-dup');if(!el)return;
  const hits=similarSuppliers(val('sf-name'));
  el.innerHTML=hits.length?(editSupId?'Possible duplicate of ':'Already on the list: ')+
    hits.map(s=>'<a href="#" onclick="pickExisting(\''+s.ID+'\');return false">'+esc(s.Name)+'</a>').join(' · ')+
    (editSupId&&modern()?' — see Merge below.':''):'';
}
/* Clicked the existing supplier in the duplicate hint. Mid-way through
   adding a sample, that means "use this one": it's chosen in the form.
   Otherwise the window switches to it. */
function pickExisting(sid){

    if(supFrom&&!editSupId){const from=supFrom;closeOv('ov-supplier',{force:true});selectSupplierIn(from,sid);}
    else{loadSupplier(sid);document.getElementById('md-supplier').scrollTop=0;document.getElementById('ov-supplier').scrollTop=0;}
  };

  if(!editSupId||!supDirty())return go();

/* Delete is for suppliers added by mistake. One with samples on record
   stays — those samples are project history and the supplier's scoring —
   and a duplicate is merged instead. The server re-checks, so a page
   that's out of date can't get round it. */
function delSupplier(){
  const s=SUP[editSupId];if(!s)return;
  const n=DB.lines.filter(l=>l['Supplier ID']===s.ID).length;
  if(n){
    ask({title:'Can’t delete '+s.Name,
      text:s.Name+' has '+plural(n,'sample')+' on record, so it stays. If it’s a duplicate, '+
        (modern()?'use “Merge into another supplier” at the bottom of this window: its samples move to the supplier you keep.'
                 :'open its History, Edit each sample and switch the Supplier to the right one. Once it has none left, you can delete it.'),
      ok:'OK',cancel:false});
    return;
  }
  const nr=(REPSBYSUP[s.ID]||[]).length;
  ask({title:'Delete '+s.Name+'?',text:(nr?'Its '+plural(nr,'rep')+' '+(nr>1?'go':'goes')+' with it. ':'')+'This can’t be undone.',
    ok:'Delete supplier',danger:true}).then(ok=>{
      if(!ok)return;
      removeThing('supplier',s.ID,'Supplier deleted');
      editSupId=null;closeOv('ov-supplier',{force:true});
      if(isOpen('ov-project'))renderProjectModal();
    });
}
/* Folds this (duplicate) supplier into the one picked. Code.gs does the
   real work in one locked request; the same fold happens here so the
   screen shows the result straight away. */
function mergeSupplier(){
  const from=SUP[editSupId],into=SUP[val('sf-merge')];
  if(!from||!into){toast('Pick the supplier to keep',true);return;}
  const nl=DB.lines.filter(l=>l['Supplier ID']===from.ID).length,nr=(REPSBYSUP[from.ID]||[]).length;
  const moving=[nl?plural(nl,'sample'):'',nr?plural(nr,'rep'):''].filter(Boolean).join(' and ');
  ask({title:'Merge '+from.Name+' into '+into.Name+'?',
    text:(moving?'Moves '+moving+' to '+into.Name+', then deletes ':'Deletes ')+from.Name+'. Its tags, and any contact details '+into.Name+' is missing, carry over. This can’t be undone.',
    ok:'Merge',danger:true}).then(ok=>{
      if(!ok)return;
      DB.lines.forEach(l=>{if(l['Supplier ID']===from.ID)l['Supplier ID']=into.ID;});
      DB.reps.forEach(r=>{if(r['Supplier ID']===from.ID)r['Supplier ID']=into.ID;});
      ['Website','Username','Sample Dept Email'].forEach(h=>{if(!into[h]&&from[h])into[h]=from[h];});
      if(from.Notes&&(into.Notes||'').indexOf(from.Notes)===-1)into.Notes=into.Notes?into.Notes+' · '+from.Notes:from.Notes;
      into.Tags=parseTags((into.Tags||'')+','+(from.Tags||'')).join(', ');
      DB.suppliers=DB.suppliers.filter(s=>s.ID!==from.ID);
      if(tFilter.sup===from.ID)tFilter.sup=into.ID;if(pFilter.sup===from.ID)pFilter.sup=into.ID;if(rState.sup===from.ID)rState.sup=into.ID;
      index();refreshFilters();
      persist([{action:'mergeSupplier',payload:{from:from.ID,into:into.ID}}],'Merged into '+into.Name);
      editSupId=null;closeOv('ov-supplier',{force:true});
      if(isOpen('ov-project'))renderProjectModal();
      if(isOpen('ov-history')&&histSup===from.ID){histSup=into.ID;renderHistory();}
    });
}
function syncRepDraft(){
  repDraft.forEach((r,i)=>{r.Name=val('rf-name-'+i);r['Product Line']=val('rf-pl-'+i);r.Email=val('rf-email-'+i);r.Phone=val('rf-phone-'+i);r.Notes=val('rf-notes-'+i);});
}
function addRepDraft(){syncRepDraft();repDraft.push(blankRep());renderSupplierModal();}
/* Removing a rep waits for Save like every other edit here — closing
   without saving keeps them. */
function removeRepDraft(i){
  syncRepDraft();
  const r=repDraft[i];
  if(r.ID&&!r._new)repRemoved.push(r.ID);
  repDraft.splice(i,1);if(!repDraft.length)repDraft.push(blankRep());
  renderSupplierModal();
}
/* The supplier, removed reps and changed reps go as one request. A rep
   that didn't change isn't sent at all. */
function submitSupplier(anyway){
  const s=readSupForm();
  if(!s.Name){toast('The supplier needs a name',true);return;}
  if(!editSupId&&!anyway){
    const hits=similarSuppliers(s.Name);
    if(hits.length){
      ask({title:'Add a new supplier?',text:'“'+s.Name+'” looks like '+hits.map(x=>'“'+x.Name+'”').join(' and ')+', already on the list.',
        ok:'Add anyway',cancel:'Go back'}).then(ok=>{if(ok)submitSupplier(true);});
      return;
    }
  }
  syncRepDraft();
  const from=supFrom,isNew=!editSupId,ops=[];
  let sid=editSupId;
  if(sid){const cur=SUP[sid],b={...cur};Object.assign(cur,s);ops.push(opSave('supplier',cur,b));}
  else{const sup={ID:newId('S'),...s,Created:today()};sid=sup.ID;ops.push(opSave('supplier',sup));}
  repRemoved.forEach(id=>ops.push(opDelete('rep',id)));
  repDraft.forEach(r=>{
    if(!(r.Name||r.Email||r.Phone))return;
    if(r._new||!r.ID)r.ID=newId('R');
    delete r._new;r['Supplier ID']=sid;
    ops.push(opSave('rep',r));
  });
  editSupId=sid;
  commit(ops,isNew?'Supplier added':'Supplier saved');
  refreshFilters();
  closeOv('ov-supplier',{force:true});
  afterSupplierSaved(sid,isNew,from);
}
/* back in whichever form was open: the supplier list is current, and a
   supplier added from a form is chosen in it */
function afterSupplierSaved(sid,isNew,from){
  if(isOpen('ov-project'))renderProjectModal();
  ['al','np1'].forEach(p=>{
    const sel=document.getElementById(p+'-sup');if(!sel)return;
    const cur=sel.value;sel.innerHTML=supplierOptions();sel.value=SUP[cur]?cur:'';
  });
  if(isNew&&from)selectSupplierIn(from,sid);
}

/* ============================ windows ============================== */
/* Open windows stack. Esc, ✕ and the phone's Back button close the TOP
   one only, and each asks before throwing away unsaved typing. Every
   window owns one history entry, so Android's Back closes it rather
   than the whole app. The in-app dialog (ask) owns none: Back just
   cancels it. */
let ovStack=[], ovReturn={}, ovOwnsEntry={}, skipPop=0;
function openOv(id,mode){
  const el=document.getElementById(id);
  if(el.classList.contains('open'))return;
  ovReturn[id]=document.activeElement;
  el.classList.add('open');
  ovStack.push(id);
  ovOwnsEntry[id]=mode!=='none';
  if(mode==='replace')history.replaceState({ov:id,view},'');
  else if(mode!=='none')history.pushState({ov:id,view},'');
  const m=el.querySelector('.modal');
  if(m){const t=m.querySelector('h2');m.setAttribute('aria-label',t?t.textContent:'');if(mode!=='none')m.focus({preventScroll:true});}
}
function topOv(){return ovStack[ovStack.length-1]||null;}
/* What a window would lose if closed now, in words — '' if nothing. */
function dirtyMsg(id){
  if(id==='ov-project')return projDirty();
  if(id==='ov-new')return newProjDirty();
  if(id==='ov-supplier')return supDirty();
  if(id==='ov-history')return editorDirty()?'Your edits to this sample haven’t been saved.':'';
  return '';
}
/* Closes one window; resolves true if it closed. opts: force (don't
   ask), fromPop (Back already used up its history entry), keepEntry
   (the entry is handed to the next window — see submitNewProject). */
function closeOv(id,opts){
  opts=opts||{};
  const el=document.getElementById(id);
  if(!el.classList.contains('open'))return Promise.resolve(true);
  const d=opts.force?'':dirtyMsg(id);
  const go=()=>{
    el.classList.remove('open');
    ovStack=ovStack.filter(x=>x!==id);
    if(ovOwnsEntry[id]&&!opts.fromPop&&!opts.keepEntry){skipPop++;history.back();}
    ovOwnsEntry[id]=false;
    onClosed(id);
    const r=ovReturn[id];ovReturn[id]=null;
    if(r&&r.focus&&document.contains(r))r.focus({preventScroll:true});
    return true;
  };
  if(!d)return Promise.resolve(go());
  if(opts.fromPop)history.pushState({ov:id,view},'');   /* Back took the entry; put it back while we ask */
  return ask({title:'Discard changes?',text:d,ok:'Discard',danger:true,cancel:'Keep editing'})
    .then(ok=>{if(!ok)return false;opts.fromPop=false;return go();});
}
function onClosed(id){
  if(id==='ov-dlg')return;
  if(id==='ov-project'){editLineId=null;prefillLine=null;stickyLine=null;projEditOpen=false;}
  if(id==='ov-history'){histSup=null;editLineId=null;}
  if(id==='ov-acc')accCtx=null;
  if(id==='ov-supplier')supFrom=null;
  render();
}
/* In-app confirm / prompt / alert. o: {title, text, ok, cancel (false
   for none), alt (a third choice), danger, input:{value, label}}.
   Resolves true on OK — or the typed text, with an input — 'alt' for
   the alt button, and false (null with an input) on Cancel, ✕, Esc or
   Back. */
let dlgResolve=null, dlgHasInput=false, dlgState=null;
function ask(o){
  return new Promise(res=>{
    if(dlgResolve)dlgDone(false);
    dlgResolve=res;dlgHasInput=!!o.input;dlgState=history.state;
    document.getElementById('md-dlg').innerHTML=
      '<button class="close" aria-label="Close" onclick="dlgDone(false)">'+ic('x')+'</button>'+
      '<h2>'+esc(o.title)+'</h2>'+
      (o.text?'<p class="dlgtext">'+esc(o.text)+'</p>':'')+
      (o.input?'<label for="dlg-in">'+esc(o.input.label||'')+'</label><input id="dlg-in" value="'+esc(o.input.value||'')+'">':'')+
      '<div class="dlgfoot"><button class="btn'+(o.danger?' bad':'')+'" id="dlg-ok" onclick="dlgDone(true)">'+esc(o.ok||'OK')+'</button>'+
      (o.alt?'<button class="btn ghost" onclick="dlgDone(\'alt\')">'+esc(o.alt)+'</button>':'')+
      (o.cancel===false?'':'<button class="btn ghost" onclick="dlgDone(false)">'+esc(o.cancel||'Cancel')+'</button>')+'</div>';
    openOv('ov-dlg','none');
    const inp=document.getElementById('dlg-in');
    if(inp){inp.focus();inp.select();inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();dlgDone(true);}});}
    else document.getElementById('dlg-ok').focus();
  });
}
function dlgDone(v){
  const inp=document.getElementById('dlg-in');
  const out=v===true?(inp?inp.value:true):(v==='alt'?'alt':(dlgHasInput?null:false));
  const r=dlgResolve;dlgResolve=null;
  closeOv('ov-dlg',{force:true});
  if(r)r(out);
}
window.addEventListener('popstate',e=>{
  if(skipPop>0){skipPop--;return;}
  const top=topOv();
  if(top==='ov-dlg'){history.pushState(dlgState,'');dlgDone(false);return;}
  if(top){closeOv(top,{fromPop:true});return;}
  const st=e.state||{};
  rState.sup=st.sup||null;
  show(st.view||'today',true);
});
/* keep Tab inside the top window */
function trapTab(e,top){
  const m=document.querySelector('#'+top+' .modal');if(!m)return;
  const f=[...m.querySelectorAll('button,input,select,textarea,a[href],summary,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length);
  if(!f.length)return;
  const a=document.activeElement,first=f[0],last=f[f.length-1];
  if(!m.contains(a)){e.preventDefault();first.focus();}
  else if(e.shiftKey&&(a===first||a===m)){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&a===last){e.preventDefault();first.focus();}
}
document.addEventListener('keydown',e=>{
  const top=topOv();
  if(e.key==='Escape'&&top){e.preventDefault();if(top==='ov-dlg')dlgDone(false);else closeOv(top);return;}
  if(e.key==='Tab'&&top){trapTab(e,top);return;}
  /* Enter / Space on a div that plays a button (project cards) */
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();}
});

/* ========================= auto refresh ============================ */
/* Pulls fresh data in the background. Never shows the loader, never
   steals what you are doing — if you are mid-anything it waits. */

function refreshBlocked(){
  if(syncing || refreshing || pendingSaves>0)         return 'save in flight';
  if(ovStack.length)                                  return 'modal open';
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return 'typing';
  if(document.hidden)                                  return 'tab hidden';
  return '';
}

function scheduleRefresh(ms){
  if(!AUTO_REFRESH_MS)return;
  clearTimeout(autoTimer);
  autoTimer=setTimeout(autoRefresh, ms==null?AUTO_REFRESH_MS:ms);
}

function autoRefresh(){
  if(refreshBlocked()){scheduleRefresh(AUTO_RETRY_MS);return;}
  silentRefresh().then(r=>scheduleRefresh(r===false?AUTO_RETRY_MS:null));
}

/* Resolves true if applied, false if thrown away, null if it failed.
   Thrown away when anything was saved (or a window opened) while it
   was in flight: the data predates that change, and laying it over the
   screen would visibly undo it. */
function silentRefresh(){
  syncing=true;
  const gen=saveGen,y=window.scrollY;
  return apiGet().then(data=>{
    if(saveGen!==gen||pendingSaves>0||ovStack.length)return false;
    useData(data);render();
    window.scrollTo({top:y});
    return true;
  }).catch(()=>null)                /* offline / hiccup — silent, we just try again next cycle */
    .finally(()=>{syncing=false;});
}

/* The refresh buttons, and the reload after a failed save. No loader —
   the button spins — and open windows are redrawn in place, keeping
   anything typed in them. quiet: no "refreshed" message (a failed
   save's message is still showing). */
function refreshNow(opts){
  opts=opts||{};
  if(refreshing)return;
  if(pendingSaves>0){if(opts.quiet)reloadAfterSaves=true;else toast('Still saving — try again in a moment');return;}
  refreshing=true;setBusy(true);
  const gen=saveGen,y=window.scrollY;
  let again=false;
  apiGet().then(data=>{
    if(saveGen!==gen){again=true;return;}
    useData(data);redraw();
    window.scrollTo({top:y});
    if(!opts.quiet)toast('Data refreshed');
    scheduleRefresh();
  }).catch(e=>{
    if(!opts.quiet)toast('Couldn’t reach the sheet — '+e.message,{err:true});
    scheduleRefresh(AUTO_RETRY_MS);
  }).finally(()=>{
    refreshing=false;setBusy(false);
    if(again){if(pendingSaves)reloadAfterSaves=true;else refreshNow({quiet:true});}
  });
}
function setBusy(on){document.querySelectorAll('.refreshbtn').forEach(b=>{b.classList.toggle('busy',on);b.disabled=on;});}

/* Takes a dataset as the one to work from. cachedAt: it came from this
   device's saved copy (so its "today" is stale, and it's labelled as a
   saved copy). A fresh one is saved as the copy for next time. */
function useData(data,cachedAt){
  DB=data;
  CFG={...CFG_DEFAULT,...(DB.config||{})};
  if(cachedAt){DB.today=localDay();lastSync=new Date(cachedAt);lastSyncCached=true;}
  else{lastSync=new Date();lastSyncCached=false;saveCache(data);}
  index();refreshFilters();stampSync();
}
function saveCache(data){try{localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),data}));}catch(e){}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return c&&c.at&&c.data&&c.data.lines?c:null;}catch(e){return null;}}

function syncWhen(d){
  const t=d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});
  return localDay(d)===localDay()?t:nice(localDay(d))+', '+t;
}
function stampSync(){
  const txt=lastSync?(lastSyncCached?'Saved copy · ':'Updated ')+syncWhen(lastSync):'';
  document.querySelectorAll('.synced').forEach(el=>{el.textContent=txt;});
}

/* Coming back to the tab: if the data is stale, refresh right away. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!AUTO_REFRESH_MS)return;
  if(lastSync && !lastSyncCached && (Date.now()-lastSync.getTime())<AUTO_REFRESH_MS)return;
  autoRefresh();
});

/* ==================== supplier order history ====================== */
/* Every sample ever ordered from one supplier, across all projects,
   editable in place. This is the record that drives the speed and
   accuracy badges — fix it here and the scoring corrects itself. */

let histSup=null, histFilter={q:'',status:''};
const ACCURACY_OPTS=['','Correct','Incomplete','Wrong item'];

function openHistory(sid){
  histSup=sid; histFilter={q:'',status:''}; editLineId=null;
  document.getElementById('md-history').innerHTML='';
  renderHistory();
  document.getElementById('md-history').scrollTop=0;document.getElementById('ov-history').scrollTop=0;
  openOv('ov-history');
}
function closeHistory(){closeOv('ov-history');}
function histLines(){
  let ls=DB.lines.filter(l=>l['Supplier ID']===histSup);
  if(histFilter.status==='Problems')      ls=ls.filter(l=>l.Accuracy&&l.Accuracy!=='Correct');
  else if(histFilter.status==='Overdue')  ls=ls.filter(isOverdue);
  else if(histFilter.status==='Excluded') ls=ls.filter(isExcluded);
  else if(histFilter.status==='Unmeasured') ls=ls.filter(l=>!isExcluded(l)&&l.Status!=='Ordered'&&!(l['Date Ordered']&&l['Date Arrived']));
  else if(histFilter.status)              ls=ls.filter(l=>l.Status===histFilter.status);
  if(histFilter.q){
    const q=histFilter.q.toLowerCase();
    ls=ls.filter(l=>{const p=PROJ[l['Project ID']]||{};const r=rep(l['Rep ID'])||{};
      return ((l.Product||'')+' '+(l.Manufacturer||'')+' '+(l.SKU||'')+' '+(l.Notes||'')+' '+(p['Project Name']||'')+' '+(p.Client||'')+' '+(r.Name||''))
        .toLowerCase().includes(q);});
  }
  return ls.sort((a,b)=>(b['Date Ordered']||'').localeCompare(a['Date Ordered']||''));
}
function histSetQ(v){histFilter.q=v;deb(()=>renderHistory(true));}
function histSetStatus(v){histFilter.status=v;renderHistory();}

function renderHistory(keepFocus){
  if(!histSup)return;
  const keep=grabFields('md-history',dropNext);dropNext=[];
  const s=SUP[histSup]||{Name:'Unknown supplier'};
  const st=supStats(histSup);
  const ls=histLines();

  let h='<button class="close" aria-label="Close" onclick="closeHistory()">'+ic('x')+'</button>'+
    '<h2>'+esc(s.Name)+' <span class="subtle" style="font-weight:400">— order history</span></h2>'+
    '<p class="subtle" style="margin-top:4px">'+
      (st.total?('Ordered '+st.first.slice(0,4)+(st.first.slice(0,4)!==st.last.slice(0,4)?'–'+st.last.slice(0,4):'')+
        ' · last order '+nice(st.last)):'Nothing ordered from this supplier yet')+
    '</p>';

  /* stats strip — the same numbers that drive the badges */
  h+='<div class="histstats">'+
    '<div class="hstat"><div class="n">'+st.total+'</div><div class="t">samples ever'+(st.excluded?' · '+st.excluded+' excluded':'')+'</div></div>'+
    '<div class="hstat'+(st.late?' bad':'')+'"><div class="n">'+st.open+(st.late?' <span class="sm">('+st.late+' late)</span>':'')+'</div><div class="t">still on order</div></div>'+
    '<div class="hstat"><div class="n">'+(st.median==null?'—':st.median+'d')+'</div><div class="t">median lead · '+st.leadCount+' counted</div></div>'+
    '<div class="hstat'+(st.accPct!=null&&st.accPct<70?' bad':'')+'"><div class="n">'+(st.accPct==null?'—':st.accPct+'%')+'</div><div class="t">accurate · '+st.accCount+' counted</div></div>'+
    '</div>';

  if(st.unmeasured){
    h+='<div class="hint warn">'+st.unmeasured+' sample'+(st.unmeasured>1?'s have':' has')+' arrived but '+(st.unmeasured>1?'are':'is')+
      ' missing an order or arrival date, so '+(st.unmeasured>1?'they are':'it is')+
      ' <b>silently absent from the median</b> — not excluded, just unmeasurable. Filter to <b>Unmeasured</b> to fill the gaps.</div>';
  }

  /* filters */
  h+='<div class="toolbar" style="margin-top:14px">'+
    '<div class="searchwrap">'+ic('search')+
    '<input type="search" id="hf-q" aria-label="Search this supplier’s samples" placeholder="Search product, SKU, project, rep…" value="'+esc(histFilter.q)+'" oninput="histSetQ(this.value)"></div>'+
    '<select aria-label="Show" onchange="histSetStatus(this.value)">'+
      ['','Ordered','Arrived','Delivered','Overdue','Problems','Excluded','Unmeasured']
        .map(v=>'<option value="'+v+'"'+(histFilter.status===v?' selected':'')+'>'+(v||'All samples')+'</option>').join('')+
    '</select></div>';

  if(!ls.length){
    h+='<div class="empty">'+(st.total?'<b>No samples match that filter.</b>':'<b>No history yet.</b> Once you order samples from '+esc(s.Name)+', they show up here.')+'</div>';
  }else{
    h+='<div class="subtle" style="margin-bottom:8px">'+ls.length+' of '+st.total+' shown · newest first</div>';
    ls.forEach(l=>{h+=(editLineId===l.ID)?lineEditor(l):histRow(l);});
  }
  document.getElementById('md-history').innerHTML=h;
  putFields(keep);

  if(keepFocus){
    const q=document.getElementById('hf-q');
    if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}
  }
}

function histRow(l){
  const p=PROJ[l['Project ID']]||{};
  const r=rep(l['Rep ID']);
  const od=isOverdue(l);
  const ex=isExcluded(l);
  const lead=(l['Date Ordered']&&l['Date Arrived'])?dDiff(l['Date Ordered'],l['Date Arrived']):null;
  const unmeasured=!ex&&l.Status!=='Ordered'&&!(l['Date Ordered']&&l['Date Arrived']);
  let dates='ordered '+nice(l['Date Ordered']);
  if(l['Date Arrived'])   dates+=' → arrived '+nice(l['Date Arrived'])+(lead!=null?' ('+lead+'d)':'');
  else if(l['Expected Arrival']) dates+=' → expected '+nice(l['Expected Arrival']);
  if(l['Date Delivered']) dates+=' → handed off '+nice(l['Date Delivered']);
  const late=!od||ex?'':(l['Expected Arrival']?dDiff(l['Expected Arrival'],today())+'d late':'no ETA · '+dDiff(l['Date Ordered'],today())+'d');

  return '<div class="rowcard s-'+esc(l.Status)+(od&&!ex?' overdue':'')+(ex?' excluded':'')+'">'+
    '<div class="grow">'+sampleTitle(l)+
      '<div class="meta">'+esc(p['Project Name']||'(project deleted)')+
        (p.Client?' · '+esc(p.Client):'')+(r&&r.Name?' · rep '+esc(r.Name):'')+'</div>'+
      '<div class="meta">'+esc(dates)+'</div>'+
      (ex?'<div class="meta exwhy">Not counted — '+esc(exReason(l))+'</div>':'')+
      (unmeasured?'<div class="meta exwhy warn">Missing a date — not counted toward the median</div>':'')+
      (l.Notes?'<div class="meta subtle">'+esc(l.Notes)+'</div>':'')+
    '</div>'+
    (late?'<span class="pill late">'+late+'</span>':'')+
    (ex?'<span class="pill neutral">excluded</span>':'')+
    (l.Accuracy?'<span class="pill '+(l.Accuracy==='Correct'?'Arrived':'warn')+(ex?' faded':'')+'">'+esc(l.Accuracy)+'</span>'
               :(ex?'':'<span class="pill neutral">unrated</span>'))+
    '<span class="pill '+esc(l.Status)+'">'+esc(l.Status)+'</span>'+
    (ex?'<button class="btn sm good" onclick="histInclude(\''+l.ID+'\')" title="Count this sample again">'+ic('check')+' Re-include</button>'
       :'<button class="btn sm ghost" onclick="histExclude(\''+l.ID+'\')" title="Stop this sample affecting the scores">'+ic('half')+' Exclude</button>')+
    '<button class="btn sm ghost" onclick="editLine(\''+l.ID+'\')">'+ic('edit')+' Edit</button>'+
    '</div>';
}

/* one-click exclude, so fixing a distorted average doesn't mean
   opening the full editor on every bad row. What Exclude is for is
   explained here, where it's being used, not on every visit. */
function histExclude(id){
  const l=DB.lines.find(x=>x.ID===id); if(!l)return;
  const sn=(SUP[l['Supplier ID']]||{}).Name||'this supplier';
  ask({title:'Stop counting this sample?',
    text:'It stays on its project, but stops moving '+sn+'’s speed and accuracy numbers. Use it when the record is real but the timing isn’t the supplier’s doing — a sample that sat in the warehouse a week before anyone marked it arrived measures our receiving, not the supplier.',
    input:{label:'Reason (kept on the record)',value:'Late receiving on our end — not the supplier'},ok:'Exclude'}).then(why=>{
      if(why===null)return;
      const b={...l};
      l.Exclude=(why.trim()||'Excluded — no reason given');
      saveLine(l,'Excluded from scoring',b);
      renderHistory();
    });
}
function histInclude(id){
  const l=DB.lines.find(x=>x.ID===id); if(!l)return;
  const b={...l};
  l.Exclude='';
  saveLine(l,'Counting again',b);
  renderHistory();
}

/* ============================== boot =============================== */
/* Loading copy. The tracker loads in well under a second, so each of
   these is a glance, not a read — short, dry, and about the actual job.
   House rules if you add more:
     - it is an aside, not a joke. No exclamation marks, no puns that ask
       for credit. Understated survives the hundredth reading.
     - never imply something is lost, broken, or slow. This shows while
       the user waits; it must not plant a worry.
     - keep it to work anyone here would recognise from a Tuesday.
   Errors deliberately get none of this — see the catch in boot(). */
const LOADING_LINES=[
  'Unrolling the broadloom…',
  'Checking the sample racks…',
  'Sorting the beige from the greige…',
  'Deciding whether Almond and Oatmeal are different…',
  'Counting boxes in the back…',
  'Cross-referencing the packing slip…',
  'Asking a rep for a realistic ETA…',
  'Politely chasing a supplier…',
  'Matching SKUs to colour names…',
  'Flattening a curled carpet tile…',
  'Measuring twice…',
  'Squinting at someone’s handwriting…',
  'Checking under the desk…',
  'Tidying the sample wall…',
  'Stacking vinyl planks by finish…',
  'Confirming the courier actually came…',
  'Filing the ones already handed off…',
  'Digging through the pile by the door…',
  'Untangling the underlay…',
  'Peeling a label off a returned sample…',
  'Holding two greys up to the light…',
  'Looking for the one that shipped ‘Tuesday’…',
  'Finding the box marked misc…',
  'Reuniting a sample with its project…'
];
let lastLoadLine=-1;
function loadingLine(){
  let i=Math.floor(Math.random()*LOADING_LINES.length);
  if(i===lastLoadLine)i=(i+1)%LOADING_LINES.length;   /* never the same one twice running */
  lastLoadLine=i;
  return LOADING_LINES[i];
}
/* With a saved copy on this device the app draws from it at once and
   fetches in the background; without one, the loader shows until the
   data arrives. */
function boot(){
  const ld=document.getElementById('loader');
  if(API_URL.indexOf('PASTE_')===0){
    ld.innerHTML='<div class="empty" style="max-width:420px"><b>Almost there.</b><br>Open index.html and paste your Apps Script /exec URL and token into the CONFIGURE ME block at the top of the script.</div>';
    return;
  }
  history.replaceState({view},'');
  const c=loadCache();
  if(c){useData(c.data,c.at);ld.style.display='none';render();}
  else{
    /* rebuilt every boot: picks a fresh line, and restores the spinner
       after a failed load left its error markup in here */
    ld.innerHTML='<div class="spin"></div><div class="loadmsg">'+esc(loadingLine())+'</div>';
    ld.style.display='flex';
  }
  const gen=saveGen;
  syncing=true;
  apiGet().then(data=>{
    /* already working from the saved copy — don't pull the rug out */
    if(c&&(saveGen!==gen||ovStack.length)){scheduleRefresh(AUTO_RETRY_MS);return;}
    const y=window.scrollY;
    useData(data);ld.style.display='none';render();
    if(c)window.scrollTo({top:y});
    scheduleRefresh();
  }).catch(e=>{
    if(c){
      toast('Can’t reach the sheet — showing the copy saved '+syncWhen(new Date(c.at)),{err:true,ms:6000});
      scheduleRefresh(AUTO_RETRY_MS);return;
    }
    /* plain on purpose — a joke here reads as flippant about a real problem */
    ld.innerHTML='<div class="empty" style="max-width:420px">Could not load data — '+esc(e.message)+'<br><br><button class="btn" onclick="boot()">Try again</button></div>';
  }).finally(()=>{syncing=false;});
}
boot();
</script>
</body>
</html>
