<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RDCO Sample Tracker</title>
<meta name="theme-color" content="#F7FAFB">
<!-- desktop only: on a phone the working surface covers the photo -->
<link rel="preload" as="image" href="background.webp" fetchpriority="high" media="(min-width:721px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Samples">
<meta name="description" content="Red Deer Carpet One — commercial flooring sample tracking">
<style>
/* ================================================================
   RDCO SAMPLE TRACKER — "Vista" theme
   A photographic ground, heavily blurred, with quiet frosted chrome
   on top. The backdrop carries the colour so the interface doesn't
   have to. ONE accent (teal) means "you can act on this" and nothing
   else; status reads as a neutral -> warm -> green progression, and
   red is reserved exclusively for problems.
   Display face: SF Pro on Apple hardware, Inter everywhere else.
   ================================================================ */
:root{
  --paper:#FFFFFF;
  --ink:#0E1B24; --ink2:#5A6B78; --ink3:#93A2AD;
  --line:#E4EAEE; --line-h:#CBD6DD;

  /* the one accent — interactive only, never status */
  /* taken from the Carpet One logo (#008C99) so the brand drives the app
     rather than sitting next to a second, nearly-identical teal.
     -d is the hover/pressed step; -soft and -line are ~12% and ~30%
     mixes over white. Change these together or they drift apart. */
  --accent:#008C99; --accent-d:#006E7A; --accent-soft:#E0F1F3; --accent-line:#B2DCE0;

  /* status progression: waiting -> arrived -> done */
  --wait:#8A7A55; --wait-soft:#F6F1E4;
  --good:#1E7A55; --good-soft:#E4F3EC;
  --done:#7C8B96; --done-soft:#EFF2F4;
  --alert:#B23A34; --alert-soft:#FAEBEA; --alert-line:#EDCCC9;

  --radius:18px; --radius-sm:11px; --radius-lg:24px;
  --shadow:0 1px 2px rgba(14,27,36,.05),0 6px 20px rgba(14,27,36,.07);
  --shadow-md:0 2px 5px rgba(14,27,36,.07),0 14px 36px rgba(14,27,36,.12);
  --shadow-lg:0 26px 70px rgba(10,22,30,.28);
  --ease:cubic-bezier(.22,.61,.36,1); --spring:cubic-bezier(.16,1,.3,1);
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%}
body{
  color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;
  min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:#DCE6EA;
}
/* fixed photographic ground. A real fixed layer rather than
   background-attachment:fixed, which janks badly on iOS Safari. */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:url('background.webp') center/cover no-repeat;
}
/* scrim — lifts the photo far enough back that dark text sits on it
   comfortably. Raise the alpha if it still feels loud. */
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(250,252,252,.34) 0%,rgba(250,252,252,.20) 34%,rgba(250,252,252,.42) 100%);
}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.021em;color:var(--ink);line-height:1.16}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button{font-family:var(--body);cursor:pointer;border:none;border-radius:var(--radius-sm);font-weight:590;letter-spacing:-.005em;color:var(--ink);
  transition:background .18s var(--ease),color .18s var(--ease),transform .14s var(--spring),box-shadow .2s var(--ease),border-color .18s var(--ease)}
button:active{transform:scale(.97)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
input,select,textarea{
  font-family:var(--body);font-size:15px;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;width:100%;outline:none;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px rgba(0,140,153,.13)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:12px 0 5px}
.icon{width:16px;height:16px;flex:none;vertical-align:-3px}
.icon.lg{width:20px;height:20px}

/* ------------------------------------------------------ header --- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(252,254,254,.86);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid rgba(14,27,36,.07);padding:14px 24px 0}
.brand{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.brand .mark{display:flex;align-items:center;align-self:center}
.brand h1{font-size:23px;font-weight:600;letter-spacing:-.028em;font-feature-settings:"ss01","cv11"}
.brand .sub{color:var(--ink3);font-size:12px;font-weight:450;letter-spacing:.005em;
  padding-left:11px;border-left:1px solid var(--line)}
@media(max-width:520px){.brand .sub{display:none}}
.nav{display:flex;gap:6px;margin-top:12px;padding-bottom:12px;align-items:center;flex-wrap:wrap}
.nav .vbtn{background:transparent;color:var(--ink2);padding:8px 15px;font-size:14px;border-radius:999px;display:flex;gap:7px;align-items:center}
.nav .vbtn:hover{background:rgba(0,140,153,.07);color:var(--ink)}
.nav .vbtn.on{background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(0,140,153,.35)}
.nav .vbtn .cnt{font-family:var(--display);font-size:11px;font-weight:700;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 7px}
.nav .vbtn:not(.on) .cnt{background:var(--alert-soft);color:var(--alert)}
.nav .spacer{flex:1}
.nav .synced{color:var(--ink3);font-size:12px;margin-right:4px;white-space:nowrap}
@media(max-width:720px){.nav .synced{display:none}}
.nav .ghost{background:var(--paper);color:var(--accent);border:1.5px solid var(--accent-line);padding:8px 15px;font-size:13.5px}
.nav .ghost:hover{background:var(--accent-soft)}

/* bottom tab bar — phones only */
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:rgba(252,254,255,.95);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;font-size:10.5px;font-weight:600;color:var(--ink3);border-radius:12px;position:relative}
.tabbar button.on{color:var(--accent)}
.tabbar button .icon{width:21px;height:21px}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:999px;
  background:var(--alert);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

main{max-width:1080px;margin:0 auto;padding:24px 20px 80px;position:relative;z-index:1}
main>section{animation:viewIn .4s var(--spring) both}
.pagehead{margin-bottom:16px}
.pagehead h2{font-size:22px}
.pagehead p{color:var(--ink2);font-size:14px;margin-top:2px}

/* -------------------------------------------------------- kpis --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 16px 14px;transition:transform .22s var(--spring),box-shadow .22s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi .n{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi .t{font-size:12.5px;color:var(--ink2);font-weight:500;margin-top:6px}
.kpi.alert{border-color:var(--alert-line);background:rgba(253,244,243,.94)}
.kpi.alert .n{color:var(--alert)}

/* ----------------------------------------------------- toolbar --- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .searchwrap{flex:2;min-width:190px;position:relative}
.toolbar .searchwrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.toolbar .searchwrap input{padding-left:36px}
.toolbar select{flex:1;min-width:140px;width:auto}
.btn{background:var(--accent);color:#fff;padding:11px 19px;font-size:14px;white-space:nowrap;
  box-shadow:0 5px 14px rgba(0,140,153,.32);display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--accent-d);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,140,153,.4)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn.ghost{background:var(--paper);color:var(--accent);border:1.5px solid var(--accent-line);box-shadow:none}
.btn.ghost:hover{background:var(--accent-soft);transform:translateY(-1px)}
.btn.good{background:var(--good);box-shadow:0 5px 14px rgba(30,122,85,.3)}
.btn.good:hover{background:#116E4E}
.btn.warn{background:var(--wait);box-shadow:0 5px 14px rgba(138,122,85,.28)}
.btn.warn:hover{background:#8C5E06}
.btn.bad{background:var(--alert);box-shadow:0 5px 14px rgba(178,58,52,.28)}
.btn.bad:hover{background:#A32E2E}
.btn.danger{background:var(--alert-soft);color:var(--alert);border:1.5px solid var(--alert-line);box-shadow:none}
.btn.danger:hover{background:#F7DCDA;transform:translateY(-1px)}

/* --------------------------------------------- sections + rows --- */
.sect{margin-bottom:28px}
.sect h2{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sect h2 .count{font-family:var(--display);font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px}
.sect h2 .count.hot{background:var(--alert-soft);color:var(--alert)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}

/* sample row — the swatch tab on the left edge is the signature */
.rowcard{position:relative;display:flex;gap:14px;align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:13px 16px 13px 22px;margin-bottom:9px;flex-wrap:wrap;overflow:hidden;
  transition:transform .2s var(--spring),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.rowcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--line-h)}
.rowcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;border-radius:0 6px 6px 0;background:var(--ink3)}
.rowcard.s-Ordered::before{background:var(--wait)}
.rowcard.s-Arrived::before{background:var(--good)}
.rowcard.s-Delivered::before{background:var(--done-soft)}
.rowcard.overdue{border-color:var(--alert-line);background:rgba(255,250,249,.94)}
.rowcard.overdue::before{background:var(--alert)}
.rowcard .grow{flex:1;min-width:190px}
.rowcard .title{font-weight:600;font-size:14.5px}
.rowcard .title .sku{color:var(--ink3);font-weight:500;font-size:13px}
.rowcard .meta{font-size:12.5px;color:var(--ink2);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:590;white-space:nowrap;letter-spacing:-.003em}
.pill.Ordered{background:var(--wait-soft);color:var(--wait)}
.pill.Arrived{background:var(--good-soft);color:var(--good)}
.pill.Delivered{background:var(--done-soft);color:var(--done)}
.pill.late{background:var(--alert-soft);color:var(--alert)}
.pill.warn{background:var(--wait-soft);color:var(--wait)}
.pill.neutral{background:var(--done-soft);color:var(--ink2)}
.empty{background:rgba(255,255,255,.90);border:1.5px dashed var(--line-h);border-radius:var(--radius);
  padding:28px;text-align:center;color:var(--ink2);font-size:14.5px}
.empty b{color:var(--ink)}

/* ------------------------------------------------ project grid --- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:17px;cursor:pointer;transition:transform .22s var(--spring),box-shadow .22s var(--ease),border-color .22s var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--accent-line)}
.pcard h3{font-size:16.5px;margin-bottom:2px}
.pcard .meta{font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.thread{height:7px;background:#E9EFF7;border-radius:999px;overflow:hidden;margin:11px 0 6px}
.thread i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#5E8BF2);border-radius:999px;transition:width .5s var(--spring)}
.thread i.done{background:linear-gradient(90deg,var(--good),#31B586)}
.pcard .prog{font-size:12px;color:var(--ink2)}
.chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}

/* -------------------------------------------------- receive mode --- */
.supgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.boxcard{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:17px 17px 15px;cursor:pointer;text-align:left;width:100%;
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),border-color .22s var(--ease)}
.boxcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--accent-line)}
.boxcard::after{content:"";position:absolute;top:0;left:16px;right:16px;height:0;border-top:2px dashed var(--line-h)}
.boxcard .bhead{display:flex;align-items:center;gap:10px}
.boxcard .bicon{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.boxcard h3{font-size:16px;line-height:1.2}
.boxcard .bmeta{font-size:12.5px;color:var(--ink2);margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.backlink{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--ink2);font-size:14px;padding:6px 10px 6px 4px;margin-bottom:10px;border-radius:9px}
.backlink:hover{background:rgba(0,140,153,.07);color:var(--ink)}
.recvrow{gap:10px}
.recvrow .btn{min-height:44px}
.justnow{opacity:.72}

/* ---------------------------------------------------- suppliers --- */
.scard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:17px;margin-bottom:12px;transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
.scard:hover{box-shadow:var(--shadow-md);border-color:var(--line-h)}
.scard .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scard h3{font-size:17px;flex:1;min-width:150px}
.replist{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.reprow{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;padding:6px 0;align-items:baseline}
.reprow b{min-width:120px;font-weight:600}
.reprow .pl{background:var(--good-soft);color:var(--good);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.kvs{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:13px;color:var(--ink2)}
.kvs .icon{color:var(--ink3)}
.copybtn{background:#EEF2F7;color:var(--ink2);border-radius:7px;padding:3px 8px;font-size:11px;font-weight:600}
.copybtn:hover{background:var(--accent-soft);color:var(--accent)}

/* -------------------------------------------------------- modal --- */
.overlay{position:fixed;inset:0;background:rgba(22,36,58,.34);display:flex;align-items:flex-start;justify-content:center;
  padding:38px 16px;overflow-y:auto;z-index:50;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s var(--ease),visibility 0s linear .32s;
  -webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}
.overlay.open{opacity:1;visibility:visible;pointer-events:auto;
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  transition:opacity .28s var(--ease),backdrop-filter .35s var(--ease),-webkit-backdrop-filter .35s var(--ease),visibility 0s}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);max-width:760px;width:100%;
  padding:26px;box-shadow:var(--shadow-lg);transform:translateY(26px) scale(.96);opacity:0;
  transition:transform .4s var(--spring),opacity .3s var(--ease)}
.overlay.open .modal{transform:none;opacity:1}
.modal h2{font-size:21px}
.modal .close{float:right;background:var(--done-soft);color:var(--ink2);width:34px;height:34px;font-size:15px;border-radius:999px}
.modal .close:hover{background:var(--alert-soft);color:var(--alert)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px}
.linecard{background:rgba(248,251,252,.94);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:9px}
.hint{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:10px 14px;font-size:12.5px;color:#2A4FB0;margin-top:10px}
.hint b{color:var(--accent-d)}
.acc-opts{display:grid;gap:10px;margin-top:16px}
.acc-opts button{padding:15px;font-size:15px;border-radius:13px;min-height:50px;justify-content:center;display:flex;align-items:center;gap:9px}
.subtle{font-size:12px;color:var(--ink3)}

/* ------------------------------------------- supplier history --- */
.histstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.hstat{background:rgba(248,251,252,.85);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.hstat .n{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hstat .n .sm{font-size:13px;font-weight:600}
.hstat .t{font-size:11.5px;color:var(--ink2);margin-top:5px}
.hstat.bad{border-color:var(--alert-line);background:var(--alert-soft)}
.hstat.bad .n{color:var(--alert)}
.histedit{background:var(--accent-soft);border-color:var(--accent-line)}
.rowcard.excluded{background:repeating-linear-gradient(135deg,rgba(250,251,252,.92),rgba(250,251,252,.92) 9px,rgba(238,242,244,.92) 9px,rgba(238,242,244,.92) 18px);border-style:dashed}
.rowcard.excluded::before{background:var(--ink3)!important}
.rowcard.excluded .title,.rowcard.excluded .meta{opacity:.62}
.rowcard.excluded .exwhy{opacity:1;color:var(--ink2);font-style:italic;margin-top:3px}
.pill.faded{opacity:.5}
.exwhy.warn{color:var(--wait);font-style:normal;font-weight:500}
.hint.warn{background:var(--wait-soft);border-color:#E2D8BE;color:#6B5D36}
.hint.warn b{color:#574A28}
#md-history .rowcard{margin-bottom:9px}
hr.soft{border:none;border-top:1px solid var(--line);margin:17px 0}

/* --------------------------------------------- toast + loader --- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px) scale(.97);
  background:var(--ink);color:#fff;border-radius:999px;padding:11px 22px;font-size:13.5px;font-weight:500;
  opacity:0;transition:opacity .3s var(--spring),transform .3s var(--spring);z-index:99;pointer-events:none;
  box-shadow:0 14px 36px rgba(22,36,58,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#toast.err{background:var(--alert)}
#loader{position:fixed;inset:0;background:rgba(247,250,251,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;z-index:100}
.spin{width:36px;height:36px;border:3px solid #D7E3F2;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* -------------------------------------------------------- mobile --- */
@media (max-width:720px){
  .topbar{padding:12px 16px 12px}
  .nav{display:none}
  .tabbar{display:flex}
  main{padding:18px 14px calc(96px + env(safe-area-inset-bottom))}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .n{font-size:27px}
  .rowcard{padding:13px 14px 13px 20px}
  .rowcard .btn.sm{min-height:44px;flex:1;justify-content:center}
  .toolbar select{min-width:calc(50% - 5px)}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:none;border-radius:20px 20px 0 0;max-height:92dvh;overflow-y:auto;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}
  .grid,.supgrid{grid-template-columns:1fr}
  .pagehead h2{font-size:20px}
  /* iOS zooms the whole page when a focused field is under 16px.
     16px exactly is the threshold — do not lower this. */
  input,select,textarea{font-size:16px}
  .histstats{grid-template-columns:1fr 1fr}
  .hstat .n{font-size:20px}
  /* history rows carry two actions; give them a full row each */
  #md-history .rowcard .btn.sm{flex:1 1 calc(50% - 5px)}
  #md-history .rowcard .pill{font-size:11px}
  .scard .head{flex-wrap:wrap}
  .scard .head .btn.sm{min-height:44px}
}

/* ================================================================
   FLAT LAYER — the console system.
   Everything above this line is the original card-based sheet; this
   overrides it wholesale. Cards become hairline-separated rows,
   shadows go to zero, radii drop to 3px, figures set in mono, and
   status is encoded ONCE (a coloured dot) instead of three times.
   The photograph frames the app; the working surface sits on solid
   paper so data never has to compete with it.
   ================================================================ */
:root{
  --display:'Archivo',system-ui,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --radius:4px; --radius-sm:3px; --radius-lg:6px;
  --shadow:none; --shadow-md:none;
  --rule:#E6EBEE;            /* hairline */
  --rule-strong:#D2DADF;
  --sheet:#FCFDFD;
}
body{font-size:13.5px;line-height:1.42;letter-spacing:-.002em}
h1,h2,h3{font-family:var(--display);letter-spacing:-.025em;font-weight:600}

/* the photo frames the app; content sits on solid paper */
body::after{background:linear-gradient(180deg,rgba(250,252,252,.16) 0%,rgba(250,252,252,.10) 30%,rgba(250,252,252,.30) 100%)}
main{max-width:1120px;background:var(--sheet);border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  padding:22px 26px 90px;min-height:calc(100vh - 96px)}

/* ---- header ---------------------------------------------------- */
.topbar{background:rgba(252,253,253,.90);border-bottom:1px solid var(--rule-strong);padding:11px 26px 0;
  -webkit-backdrop-filter:saturate(150%) blur(18px);backdrop-filter:saturate(150%) blur(18px)}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.035em;text-transform:uppercase}
.brand .sub{font-family:var(--mono);font-size:10px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink3)}
.nav{gap:2px;margin-top:9px;padding-bottom:9px}
.nav .vbtn{border-radius:3px;padding:6px 11px;font-size:12.5px;font-weight:500;letter-spacing:-.01em}
.nav .vbtn.on{background:var(--ink);color:#fff;box-shadow:none}
.nav .vbtn .cnt,.nav .vbtn:not(.on) .cnt{font-family:var(--mono);font-size:10px;font-weight:600;background:none;color:var(--alert);padding:0 0 0 5px}
.nav .vbtn.on .cnt{color:rgba(255,255,255,.72)}
.nav .ghost{border-radius:3px;border:1px solid var(--rule-strong);color:var(--ink);background:transparent;font-weight:500}
.nav .ghost:hover{background:#EFF3F4}
.nav .synced{font-family:var(--mono);font-size:10.5px;letter-spacing:-.01em}

/* ---- figures set in mono --------------------------------------- */
.kpi .n,.hstat .n,.prog,.sku,.synced,.pill,.count,.cnt,.dot,.meta .mono{font-family:var(--mono)}
.pill{font-family:var(--body)}

/* ---- KPIs become clickable filters, not decoration -------------- */
.kpis{grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:0;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.kpi{background:transparent;border:none;border-right:1px solid var(--rule);border-radius:0;padding:11px 14px;
  text-align:left;width:100%;display:block;cursor:pointer;transition:background .14s var(--ease)}
.kpi:last-child{border-right:none}
.kpi:hover{transform:none;background:#F1F5F6}
.kpi.on{background:var(--ink);}
.kpi.on .n,.kpi.on .t{color:#fff}
.kpi .n{font-size:22px;font-weight:600;letter-spacing:-.04em}
.kpi .t{font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);margin-top:3px}
.kpi.alert{background:transparent}
.kpi.alert .n{color:var(--alert)}
.kpi.alert.on{background:var(--alert)}
.kpi.alert.on .n{color:#fff}

/* ---- rows: hairlines, not cards -------------------------------- */
.rowcard{background:none!important;border:none;border-bottom:1px solid var(--rule);border-radius:0;
  box-shadow:none;padding:9px 4px;margin:0;gap:10px;align-items:baseline}
.rowcard:hover{transform:none;box-shadow:none;background:#F2F6F7!important}
.rowcard::before{display:none}                     /* encoding #1 removed */
.rowcard.overdue{background:none!important;border-color:var(--rule)}
.rowcard .title{font-size:13.5px;font-weight:600;letter-spacing:-.012em}
.rowcard .title .sku{font-size:11.5px;font-weight:400;letter-spacing:0}
.rowcard .meta{font-size:11.5px;color:var(--ink2);margin-top:1px;letter-spacing:-.005em}
.rowcard.excluded{background:none!important;border-style:solid;opacity:.55}
.rowcard.excluded .title,.rowcard.excluded .meta{opacity:1}

/* ---- status encoded ONCE: a dot ------------------------------- */
.pill{background:none!important;padding:0 0 0 1px;font-size:11.5px;font-weight:500;letter-spacing:-.005em;gap:5px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.Ordered{color:var(--wait)} .pill.Arrived{color:var(--good)} .pill.Delivered{color:var(--done)}
.pill.late{color:var(--alert);font-weight:600} .pill.warn{color:var(--wait)} .pill.neutral{color:var(--ink3)}
.pill.faded{opacity:.45}

/* ---- section heads --------------------------------------------- */
.sect{margin-bottom:22px}
.sect h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);
  padding-bottom:6px;border-bottom:1.5px solid var(--ink);margin-bottom:0}
.sect h2 .count{font-family:var(--mono);background:none;color:var(--ink3);font-size:11px;padding:0}
.sect h2 .count.hot{background:none;color:var(--alert)}

/* ---- remaining surfaces: flat, hairlined ----------------------- */
.card,.scard,.pcard,.boxcard,.linecard,.hstat,.empty,.recvrow{
  box-shadow:none!important;border-radius:var(--radius);border:1px solid var(--rule);background:var(--paper)}
.card:hover,.scard:hover,.pcard:hover,.boxcard:hover{transform:none;box-shadow:none;border-color:var(--rule-strong)}
.empty{background:none;border:1px dashed var(--rule-strong);color:var(--ink3);border-radius:var(--radius)}
.linecard,.histedit{background:#F4F8F9;border-color:var(--rule)}
.histstats{gap:0;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.hstat{border:none;border-right:1px solid var(--rule);border-radius:0;background:none;padding:11px 13px}
.hstat:last-child{border-right:none}
.hstat.bad{background:var(--alert-soft)}
.hstat .n{font-size:19px;font-weight:600;letter-spacing:-.035em}
.hstat .t{font-size:10px;text-transform:uppercase;letter-spacing:.04em}

/* ---- controls --------------------------------------------------- */
.btn{border-radius:3px;padding:8px 14px;font-size:12.5px;font-weight:500;letter-spacing:-.01em;box-shadow:none!important}
.btn:hover{transform:none;box-shadow:none!important}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.ghost{border:1px solid var(--rule-strong);color:var(--ink);background:transparent}
.btn.ghost:hover{background:#EFF3F4}
input,select,textarea{border-radius:3px;border:1px solid var(--rule-strong);font-size:13.5px;padding:8px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:none}
label{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;font-weight:500;margin:11px 0 4px}
.modal{border-radius:var(--radius-lg);box-shadow:0 30px 80px rgba(10,22,30,.30)}
.hint{border-radius:var(--radius);font-size:12px;background:#F1F6F7;border-color:var(--rule);color:var(--ink2)}
.hint b{color:var(--ink)}
.toolbar{gap:7px}
.pagehead h2{font-size:19px;letter-spacing:-.03em}
.pagehead p{font-size:12.5px}
.tabbar{background:rgba(252,253,253,.96);border-top:1px solid var(--rule-strong)}
.tabbar button{font-family:var(--mono);font-size:9px;letter-spacing:.03em;text-transform:uppercase}
.tabbar button.on{color:var(--ink)}
.tabbar .dot{font-family:var(--mono)}
@media (max-width:720px){
  main{border-left:none;border-right:none;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .topbar{padding:10px 14px 0}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid var(--rule)}
  .kpi:nth-child(2n){border-right:none}
  .kpi:nth-last-child(-n+2){border-bottom:none}
  .histstats{grid-template-columns:1fr 1fr}
  .hstat:nth-child(2n){border-right:none}
  input,select,textarea{font-size:16px}
}

.focusbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:var(--radius);
  padding:7px 8px 7px 13px;font-size:12px;margin-bottom:16px}
.focusbar b{font-weight:600}
.focusbar .btn.ghost{margin-left:auto;border-color:rgba(255,255,255,.35);color:#fff}
.focusbar .btn.ghost:hover{background:rgba(255,255,255,.14)}
.kpis{margin-bottom:20px}
/* supplier card: name leads, metrics read as a quiet stat line,
   actions sit right. Previously all four competed on one row. */
.scard{padding:14px 16px}
.scard .head{align-items:baseline;gap:8px}
.scard h3{font-size:15px;font-weight:600;letter-spacing:-.025em;flex:1 1 100%;min-width:0;margin-bottom:2px}
.scard .head .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:-.01em}
.scard .head .btn.sm{margin-left:auto}
.scard .head .btn.sm+.btn.sm{margin-left:0}
.scard .kvs{margin-top:9px;padding-top:9px;border-top:1px solid var(--rule);font-size:12px}
.supgrid{gap:10px}
/* ---- brand lockup ----------------------------------------------- */
/* The logo ships white-on-solid-teal with no transparency, so it reads
   as a deliberate teal block against the near-white topbar rather than
   a floating wordmark. Height is capped; width follows its 8.68:1
   aspect. max-width keeps it off the nav on narrow screens. */
.brand{align-items:center;gap:10px}
/* Sized by WIDTH with height:auto — never by height with a max-width,
   which clamps the width without touching the height and quietly
   squashes the wordmark on narrow screens. min() scales it smoothly
   from 226px down, so no breakpoint is needed and the 8.68:1 aspect
   holds at every width. */
.brand .logo{align-self:center;display:block;width:min(226px,52vw);height:auto;
  border-radius:2px}
/* off-screen but still announced — for headings the eye doesn't need */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
/* ---- loading copy ---------------------------------------------- */
/* Quiet by design. It should read as an aside, not a punchline —
   same weight as any other bit of secondary text on the page. */
.loadmsg{font-size:12.5px;font-weight:500;color:var(--ink2);letter-spacing:-.005em;
  max-width:300px;text-align:center;animation:viewIn .45s var(--ease)}
/* ---- handed-off archive: a disclosure row, not a card ----------- */
/* Delivered samples fold away so a long project shows only live work.
   Nothing is written or deleted — the rows simply are not drawn until
   asked for. Sits as one more hairline row so it never reads as a
   card, and the figure stays in mono like every other number. */
.archbar{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--rule);border-radius:0;
  padding:9px 4px;margin:0;color:var(--ink2);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.archbar:hover{background:#F2F6F7;color:var(--ink)}
.archbar.open{color:var(--ink)}
.archbar .grow{flex:1}
.archbar .count{font-family:var(--mono);font-size:11px;font-weight:400;
  color:var(--ink3);letter-spacing:-.01em;text-transform:none}
.archbar .chev{width:13px;height:13px;flex:none;align-self:center;color:var(--ink3);
  transform:rotate(180deg);transition:transform .18s var(--ease)}
.archbar.open .chev{transform:rotate(270deg)}
/* ---- supplier tags: the lines a supplier carries ---------------- */
/* Names, not status — so no dot and no colour, just a hairline chip
   sitting under the supplier name. Tapping one searches for it; a chip
   the current search matched goes solid, so you can see WHY a
   distributor made the list. */
.scard .head .tags{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:4px;margin:1px 0 5px}
.tag{display:inline-flex;align-items:center;gap:2px;background:transparent;border:1px solid var(--rule-strong);
  border-radius:3px;padding:1px 7px;font-size:11.5px;font-weight:500;line-height:1.5;
  letter-spacing:-.005em;color:var(--ink2)}
button.tag:hover{background:#EFF3F4;color:var(--ink)}
button.tag:active{transform:none}
.tag.hit,.tag.hit:hover{background:var(--ink);border-color:var(--ink);color:#fff}
/* the editor: chips inside something that looks and acts like an input */
.tagedit{display:flex;flex-wrap:wrap;align-items:center;gap:4px;background:var(--paper);cursor:text;
  border:1px solid var(--rule-strong);border-radius:3px;padding:4px 5px}
/* the focus ring belongs to the whole field, as on any other input */
.tagedit:focus-within{border-color:var(--ink);outline:2.5px solid var(--accent);outline-offset:2px}
.tagedit input:focus-visible{outline:none}
.tagedit .tag{background:#EFF3F4;border-color:var(--rule);color:var(--ink);padding:1px 1px 1px 7px}
.tagedit input{border:none;background:transparent;padding:4px;width:auto;flex:1 1 140px;min-width:0}
.tagx{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;
  background:none;color:var(--ink3);border-radius:2px}
.tagx:hover{background:var(--alert-soft);color:var(--alert)}
.tagx .icon{width:10px;height:10px}
/* manufacturer leads the sample title, a step quieter than the product */
.rowcard .title .mfr{font-weight:500;color:var(--ink2)}
/* supplier modal footer: save on the left, delete well away on the right */
.supfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.supfoot .btn.danger{margin-left:auto}
@media (max-width:720px){
  .tag{padding:3px 9px;font-size:12px}
  .tagedit .tag{padding:2px 2px 2px 8px}
  .tagx{width:26px;height:26px}
}
/* ---- Vista leftovers the flat layer never reached --------------- */
/* Each of these shipped in the original card theme's radii, shadows or
   colours because nothing below the FLAT LAYER banner overrode it. */
.thread{height:3px;background:var(--rule);border-radius:0;margin:12px 0 6px}
.thread i,.thread i.done{border-radius:0}
.thread i{background:var(--ink)}          /* progress is data, not an action: no teal, no gradient */
.thread i.done{background:var(--good)}
.btn.sm{border-radius:var(--radius-sm)}      /* Vista's .btn.sm (9px) outranked the flat .btn */
.acc-opts .btn{border-radius:var(--radius);font-size:13.5px;font-weight:500;padding:12px 14px;min-height:48px}
.copybtn{border-radius:var(--radius-sm);background:transparent;border:1px solid var(--rule-strong);font-weight:500}
.copybtn:hover{background:#EFF3F4;color:var(--ink)}
.backlink{border-radius:var(--radius-sm);font-size:12.5px}
.backlink:hover{background:#EFF3F4}
.boxcard .bicon{border-radius:var(--radius-sm);width:32px;height:32px}
.modal .close{border-radius:var(--radius-sm);background:transparent;color:var(--ink3);width:32px;height:32px}
.modal .close:hover{background:#EFF3F4;color:var(--ink)}
.modal:focus{outline:none}
.overlay,.modal{overscroll-behavior:contain}   /* scrolling a sheet never drags the page behind it */
.reprow .tag{font-size:11px}
.mono{font-family:var(--mono)}
/* ---- toast ------------------------------------------------------ */
/* Above the loader (99 -> 101) so a failed save is always readable;
   flat; clear of the phone tab bar; tappable only when it has Undo. */
#toast{z-index:101;border-radius:var(--radius);box-shadow:none;display:flex;align-items:center;gap:14px;
  width:max-content;max-width:calc(100vw - 32px);padding:10px 16px;font-size:12.5px;line-height:1.4}
#toast.act{pointer-events:auto;padding:6px 6px 6px 16px}
#toast .tundo{background:none;border:1px solid rgba(255,255,255,.35);border-radius:var(--radius-sm);color:#fff;
  padding:5px 12px;font-size:12px;font-weight:600;flex:none}
#toast .tundo:hover{background:rgba(255,255,255,.14)}
/* ---- Today: compact empties, hand-off groups -------------------- */
.emptyrow{padding:9px 4px;border-bottom:1px solid var(--rule);color:var(--ink3);font-size:12px}
.emptyrow b{color:var(--ink2);font-weight:600}
.grouphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 4px 7px;border-bottom:1px solid var(--rule)}
.grouphead .grow{flex:1;min-width:180px;font-size:12.5px;font-weight:600}
.grouphead .subtle{font-weight:400}
.group .rowcard{padding-left:16px}
/* ---- windows ---------------------------------------------------- */
.projfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.projfoot .btn.danger{margin-left:auto}
#sf-dup{color:var(--wait);margin-top:3px}
.mergebox{margin-top:16px;padding-top:10px;border-top:1px solid var(--rule)}
.mergebox summary{cursor:pointer;font-size:12px;font-weight:500;color:var(--ink2)}
.mergebox summary:hover{color:var(--ink)}
.mergebox p{margin:6px 0 0}
.mergerow{display:flex;gap:8px;margin-top:8px;align-items:center}
.mergerow select{flex:1;min-width:0}
/* the in-app dialog (ask): above any other window, centred on desktop */
#ov-dlg{z-index:60;align-items:center}
.modal.dlg{max-width:430px}
.dlgtext{color:var(--ink2);font-size:13px;line-height:1.5;margin:8px 0 2px}
.dlgfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
/* ---- phone top bar: refresh + "Updated", which the hidden nav carries on desktop */
.mobsync{display:none;margin-left:auto;align-items:center;gap:8px}
.iconbtn{background:transparent;border:1px solid var(--rule-strong);border-radius:var(--radius-sm);color:var(--ink);
  width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{background:#EFF3F4}
.refreshbtn.busy .icon{animation:sp .9s linear infinite}
.refreshbtn:disabled{cursor:default}
@media (max-width:720px){
  /* one row with the logo: the label wraps to two short lines first */
  .brand{flex-wrap:nowrap}
  .brand .logo{min-width:0;flex:0 1 auto}
  .mobsync{display:flex}
  .mobsync .synced{font-size:10px;color:var(--ink3);text-align:right;line-height:1.25;max-width:92px}
  #toast{bottom:calc(74px + env(safe-area-inset-bottom))}
  #ov-dlg{align-items:flex-end}
  /* the working surface covers the whole screen here, so the photo
     can't be seen — don't fetch or paint it */
  body{background:var(--sheet)}
  body::before,body::after{display:none}
}
@media (max-width:360px){.mobsync .synced{display:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .spin{animation:none}
}
</style>
</head>

<script>
/* ================================================================
   CONFIGURE ME — paste your Apps Script /exec URL and the token
   you set in Code.gs CONFIG.API_TOKEN. Nothing else to touch.
   ================================================================ */
const API_URL   = 'https://script.google.com/macros/s/AKfycbzfXigNHD7vX5sUs4PUaPLfMl4sEeswMA4uQrYAO3CEjI-mW4hgtr3_bl-pDMQPm6fF/exec';
const API_TOKEN = 'rdco-sam-7k2x9v';

/* Background auto-refresh. Set AUTO_REFRESH_MS to 0 to turn it off entirely. */
const AUTO_REFRESH_MS = 5*60*1000;   /* pull fresh data every 5 minutes      */
const AUTO_RETRY_MS   = 30*1000;     /* if deferred (busy), re-check in 30s  */

/* Code.gs reports its version with the data (DB.api). From 4 it takes
   partial saves, 'batch' and 'mergeSupplier'; against anything older
   the page saves whole rows, one request each, the way it used to. */
const API_MODERN = 4;
/* The last dataset that loaded, kept on this device so the app opens
   at once — and still shows something with no signal in the back. */
const CACHE_KEY = 'rdco-samples-v1';

/* ============================== state ============================== */
let DB = {team:[],suppliers:[],reps:[],projects:[],lines:[],today:''};
let SUP={}, PROJ={}, REPSBYSUP={}, LINESBYPROJ={};
let view='today';
let tFilter={q:'',sup:'',sort:'due'};
let pFilter={q:'',status:'Active',sales:'',sup:''};
let sFilter={q:''};
let rState={sup:null,q:''};
let receivedNow=[];                 /* line IDs received this session (Receive view) */
let justHandedOff=[];               /* line IDs handed off since this project was opened */
let showArchived=false;             /* is the handed-off section expanded? */
let openProjectId=null, accCtx=null, prefillLine=null, stickyLine=null, editLineId=null, projEditOpen=false;
let etaTouched={};                  /* add forms whose Expected arrival was typed, not estimated */
let dropNext=[];                    /* field-id prefixes the next redraw should start fresh */
let pendingSaves=0, saveGen=0, reloadAfterSaves=false;
let autoTimer=null, lastSync=null, lastSyncCached=false, syncing=false, refreshing=false;
/* Thresholds live in Code.gs CONFIG and arrive with the data, so the
   page and the morning digest can't disagree. These are the fallback. */
const CFG_DEFAULT={slowDays:12,riskDays:3,noEtaDays:14};
let CFG={...CFG_DEFAULT};

/* ============================== API ================================ */
function apiGet(){
  return fetch(API_URL+'?action=getAll&token='+encodeURIComponent(API_TOKEN))
    .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||'Load failed');return j.data;});
}
function apiPost(action,payload){
  /* body is a plain string -> browser sends text/plain -> no CORS preflight */
  return fetch(API_URL,{method:'POST',body:JSON.stringify({token:API_TOKEN,action,payload})})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||'Save failed');return j.result;});
}
function modern(){return (DB.api||0)>=API_MODERN;}

/* Saving. The screen changes first and the sheet second, so a tap
   feels instant. Three rules keep that honest:
   - an update sends only the fields that changed ({ID, ...}). Code.gs
     leaves every column it isn't sent alone, so a page that has sat
     open a while can't write its stale copy of the rest of the row
     over someone else's work — the warehouse's receive, say.
   - one action is one request: several writes go as one 'batch',
     under one lock on the sheet.
   - requests leave one at a time, in order, so an Undo can never land
     ahead of the change it undoes.                                  */
let outbox=Promise.resolve();
function persist(ops,okMsg){
  ops=(ops||[]).filter(Boolean);
  if(!ops.length)return;
  pendingSaves++;saveGen++;
  outbox=outbox.then(()=>send(ops))
    .then(()=>{if(okMsg)toast(okMsg);})
    .catch(saveFailed)
    .finally(()=>{
      pendingSaves=Math.max(0,pendingSaves-1);
      if(!pendingSaves&&reloadAfterSaves){reloadAfterSaves=false;refreshNow({quiet:true});}
    });
}
function send(ops){
  if(ops.length===1)return apiPost(ops[0].action,ops[0].payload);
  if(modern())return apiPost('batch',{ops});
  return ops.reduce((p,op)=>p.then(()=>apiPost(op.action,op.payload)),Promise.resolve());
}
/* A change that didn't reach the sheet. Said plainly, above everything
   (the loader included), for long enough to read. Then, once nothing
   else is still sending, the screen reloads to what the sheet holds. */
function saveFailed(e){
  toast('That change didn’t save — '+((e&&e.message)||'no connection')+'. Reloading what the sheet has.',{err:true,ms:8000});
  reloadAfterSaves=true;
}

const KIND={line:['lines','saveLine'],project:['projects','saveProject'],supplier:['suppliers','saveSupplier'],rep:['reps','saveRep']};
/* a record as sent: page-only keys (leading "_") left off */
function plain(o){const p={};Object.keys(o).forEach(k=>{if(k[0]!=='_')p[k]=o[k]==null?'':o[k];});return p;}
/* {ID, ...the fields of o that differ from before}, or null if none do */
function diffOf(o,before){
  const p={ID:o.ID};let n=0;
  Object.keys(o).forEach(k=>{
    if(k==='ID'||k[0]==='_')return;
    const v=o[k]==null?'':o[k];
    if(String(v)!==String(before[k]==null?'':before[k])){p[k]=v;n++;}
  });
  return n?p:null;
}
/* Puts o into DB — adding it, or folding a draft copy into the live
   record — and returns the op that saves it: the whole record if it's
   new, otherwise only what changed since `before` (a copy you took
   before changing it). Null when there's nothing to send. */
function opSave(kind,o,before){
  const [list,action]=KIND[kind];
  const cur=DB[list].find(x=>x.ID===o.ID);
  if(!cur){DB[list].push(o);return {action,payload:plain(o)};}
  if(cur!==o){before=before||{...cur};Object.assign(cur,o);}
  if(!before||!modern())return {action,payload:plain(cur)};
  const d=diffOf(cur,before);
  return d&&{action,payload:d};
}
/* takes it out of DB here, and returns the op that deletes it there */
function opDelete(kind,id){
  if(kind==='line')DB.lines=DB.lines.filter(l=>l.ID!==id);
  if(kind==='rep')DB.reps=DB.reps.filter(r=>r.ID!==id);
  if(kind==='project'){DB.lines=DB.lines.filter(l=>l['Project ID']!==id);DB.projects=DB.projects.filter(p=>p.ID!==id);}
  /* only ever reached for a supplier with no samples; its reps go too,
     and any filter still pointing at it lets go */
  if(kind==='supplier'){
    DB.suppliers=DB.suppliers.filter(s=>s.ID!==id);DB.reps=DB.reps.filter(r=>r['Supplier ID']!==id);
    if(tFilter.sup===id)tFilter.sup='';if(pFilter.sup===id)pFilter.sup='';if(rState.sup===id)rState.sup=null;
  }
  return {action:'delete',payload:{kind,id}};
}
function commit(ops,okMsg){index();persist(ops,okMsg);}
function saveLine(l,msg,before){commit([opSave('line',l,before)],msg);}
function saveProject(p,msg,before){commit([opSave('project',p,before)],msg);}
function removeThing(kind,id,msg){const op=opDelete(kind,id);index();if(kind==='supplier')refreshFilters();persist([op],msg);}
function newId(p){return p+Date.now()+'_'+Math.floor(Math.random()*10000);}
/* Put records back the way they were. changes: [{kind, o, before}] —
   the live record and a copy from just before it changed. Sent as
   ordinary saves, so it queues up behind the change it reverses. */
function undoChanges(changes,msg){
  commit(changes.map(c=>{const now={...c.o};Object.assign(c.o,c.before);return opSave(c.kind,c.o,now);}),msg||'Undone');
  redraw();
}

/* ============================ utilities ============================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ic(name){return '<svg class="icon"><use href="#i-'+name+'"/></svg>';}
/* One message at a time. A newer one replaces the older outright,
   timer and all, so it is never cut short. opts: {err, ms, undo} —
   undo adds a button and keeps the message up long enough to use it.
   toast(msg,true) still means an error. */
let toastT=null;
function toast(msg,opts){
  if(opts===true)opts={err:true};
  opts=opts||{};
  const t=document.getElementById('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(opts.undo?'<button type="button" class="tundo">Undo</button>':'');
  if(opts.undo){const fn=opts.undo;t.querySelector('.tundo').onclick=()=>{hideToast();fn();};}
  t.className='show'+(opts.err?' err':'')+(opts.undo?' act':'');
  clearTimeout(toastT);
  toastT=setTimeout(hideToast,opts.ms||(opts.undo?6500:(opts.err?5000:2600)));
}
function hideToast(){clearTimeout(toastT);document.getElementById('toast').className='';}
function localDay(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return DB.today||localDay();}
function dDiff(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000);}
function addDays(iso,n){const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function nice(iso){if(!iso)return'—';const d=new Date(iso+'T12:00');const o={month:'short',day:'numeric'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('en-CA',o);}
function median(arr){if(!arr.length)return null;const a=[...arr].sort((x,y)=>x-y);const m=Math.floor(a.length/2);return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2);}
let debT=null;function deb(fn){clearTimeout(debT);debT=setTimeout(fn,130);}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function isOpen(id){return document.getElementById(id).classList.contains('open');}
function plural(n,one,many){return n+' '+(n===1?one:(many||one+'s'));}

function index(){
  SUP={};DB.suppliers.forEach(s=>SUP[s.ID]=s);
  PROJ={};DB.projects.forEach(p=>PROJ[p.ID]=p);
  REPSBYSUP={};DB.reps.forEach(r=>(REPSBYSUP[r['Supplier ID']]=REPSBYSUP[r['Supplier ID']]||[]).push(r));
  LINESBYPROJ={};DB.lines.forEach(l=>(LINESBYPROJ[l['Project ID']]=LINESBYPROJ[l['Project ID']]||[]).push(l));
}
function rep(id){return DB.reps.find(r=>r.ID===id);}
/* A sample is excluded from SCORING when its Exclude field holds text.
   The text is the reason. It still counts as a real sample and still
   shows as on-order / late — it just stops moving the supplier's
   speed and accuracy numbers. */
function isExcluded(l){return !!(l.Exclude&&String(l.Exclude).trim());}
function exReason(l){return isExcluded(l)?String(l.Exclude).trim():'';}

/* A supplier's Tags cell is one comma-separated string — the lines it
   carries ("Tarkett, Mondo, Altro"). Split here and nowhere else, so
   the sheet stays hand-editable. Duplicates drop case-insensitively. */
function parseTags(s){
  const out=[];
  String(s==null?'':s).split(',').forEach(t=>{t=t.trim();
    if(t&&!out.some(x=>x.toLowerCase()===t.toLowerCase()))out.push(t);});
  return out;
}
function supTags(s){return parseTags(s&&s.Tags);}
/* Every line / manufacturer name already in use, most relevant first:
   this supplier's tags, then what's been ordered through it, then
   everything else. Feeds the autocomplete on both the tag editor and
   the sample Manufacturer field, so "Altro" is spelled one way. */
function knownNames(sid){
  const out=[],seen={};
  const add=t=>{t=String(t||'').trim();const k=t.toLowerCase();if(t&&!seen[k]){seen[k]=1;out.push(t);}};
  if(sid){supTags(SUP[sid]).forEach(add);DB.lines.forEach(l=>{if(l['Supplier ID']===sid)add(l.Manufacturer);});}
  DB.suppliers.forEach(s=>supTags(s).forEach(add));
  DB.lines.forEach(l=>add(l.Manufacturer));
  return out;
}
function nameOptions(names){return names.map(t=>'<option value="'+esc(t)+'">').join('');}
/* Sample title. The manufacturer leads in a quieter weight — "Altro
   Wood Safety" — unless the product name already starts with it. */
function sampleTitle(l){
  const m=String(l.Manufacturer||'').trim(),p=l.Product||'';
  const lead=m&&p.toLowerCase().indexOf(m.toLowerCase())!==0;
  return '<div class="title">'+(lead?'<span class="mfr">'+esc(m)+'</span> ':'')+esc(p||'(unnamed sample)')+
    (l.SKU?' <span class="sku">'+esc(l.SKU)+'</span>':'')+'</div>';
}

function supStats(sid){
  const ls=DB.lines.filter(l=>l['Supplier ID']===sid);
  const sc=ls.filter(l=>!isExcluded(l));                 /* scoring set */
  const leads=sc.filter(l=>l['Date Ordered']&&l['Date Arrived']).map(l=>dDiff(l['Date Ordered'],l['Date Arrived'])).filter(n=>n>=0);
  const rated=sc.filter(l=>l.Accuracy);
  const correct=rated.filter(l=>l.Accuracy==='Correct').length;
  const ords=ls.map(l=>l['Date Ordered']).filter(Boolean).sort();
  /* arrived but not measurable — a silent hole in the median */
  const unmeasured=sc.filter(l=>l.Status!=='Ordered'&&!(l['Date Ordered']&&l['Date Arrived'])).length;
  return {median:median(leads),leadCount:leads.length,accPct:rated.length?Math.round(correct/rated.length*100):null,accCount:rated.length,
    total:ls.length,
    open:ls.filter(l=>l.Status==='Ordered').length,
    late:ls.filter(isOverdue).length,
    problems:rated.length-correct,
    excluded:ls.length-sc.length,
    unmeasured:unmeasured,
    first:ords[0]||'', last:ords[ords.length-1]||''};
}
/* Overdue: on order and past its expected date — or, with no expected
   date at all, ordered more than CFG.noEtaDays ago. Without that second
   half, a sample from a supplier with no history could sit forever and
   never turn red. The morning digest uses the same rule. */
function chaseDate(l){return l['Expected Arrival']||(l['Date Ordered']?addDays(l['Date Ordered'],CFG.noEtaDays):'');}
function isOverdue(l){const d=chaseDate(l);return l.Status==='Ordered'&&!!d&&d<today();}
/* A sample is ARCHIVED once it has been received and handed off — that
   is exactly Status 'Delivered'. Derived, never stored: no column, no
   migration, and every historical delivered sample folds away the first
   time you open its project. Anything handed off while the project is
   open stays put until you leave, so you can see your own work land. */
function isArchived(l){return l.Status==='Delivered'&&!justHandedOff.includes(l.ID);}
function projProgress(pid){
  const ls=LINESBYPROJ[pid]||[];
  const arrived=ls.filter(l=>l.Status==='Arrived'||l.Status==='Delivered').length;
  const delivered=ls.filter(l=>l.Status==='Delivered').length;
  return {total:ls.length,arrived,delivered};
}
/* days an arrived sample has sat waiting to be handed off */
function waitDays(l){return l['Date Arrived']?dDiff(l['Date Arrived'],today()):null;}
function neededPill(p){
  if(!p['Needed By'])return'';
  const d=dDiff(today(),p['Needed By']);
  const cls=d<0?'late':(d<=CFG.riskDays?'late':(d<=7?'warn':'neutral'));
  const txt=d<0?('needed '+(-d)+'d ago'):'needed '+nice(p['Needed By']);
  return '<span class="pill '+cls+'">'+esc(txt)+'</span>';
}
/* Everyone who can be a salesperson: the Team tab, then anyone already
   on a project who isn't on it (people leave; projects keep the name).
   Without the second half a dropdown can't show a project's real
   salesperson, falls back to its first option, and saving quietly
   hands the project to whoever that is. */
function salesNames(){
  const team=[...new Set(DB.team.map(t=>t.Name).filter(Boolean))];
  const extra=[...new Set(DB.projects.map(p=>p.Salesperson).filter(n=>n&&!team.includes(n)))].sort((a,b)=>a.localeCompare(b));
  return team.concat(extra);
}
function salesOptions(cur){
  return '<option value="">—</option>'+salesNames().map(n=>'<option'+(n===cur?' selected':'')+'>'+esc(n)+'</option>').join('');
}
function supplierOptions(){
  return '<option value="">Choose…</option>'+[...DB.suppliers].sort((a,b)=>a.Name.localeCompare(b.Name))
    .map(s=>'<option value="'+esc(s.ID)+'">'+esc(s.Name)+'</option>').join('');
}

/* =============================== nav =============================== */
/* Each view is a history entry, so the phone's Back button walks back
   through them (and closes windows — see openOv) instead of leaving. */
function show(v,fromPop){
  const changed=v!==view;
  view=v;
  ['today','receive','projects','suppliers'].forEach(x=>{
    document.getElementById('view-'+x).style.display=x===v?'':'none';
    document.getElementById('nav-'+x).className='vbtn'+(x===v?' on':'');
    document.getElementById('tab-'+x).className=x===v?'on':'';
  });
  render();
  window.scrollTo({top:0});
  if(changed&&!fromPop)history.pushState({view:v,sup:v==='receive'?rState.sup:null},'');
}
function render(){
  updateBadges();
  if(view==='today')renderToday();
  if(view==='receive')renderReceive();
  if(view==='projects')renderProjectList();
  if(view==='suppliers')renderSupplierList();
}
/* the view, plus whichever windows show sample data */
function redraw(){
  render();
  if(isOpen('ov-project'))renderProjectModal();
  if(isOpen('ov-history'))renderHistory();
}
function updateBadges(){
  const n=DB.lines.filter(isOverdue).length;
  const b=document.getElementById('badge-today'),tb=document.getElementById('tbadge-today');
  b.style.display=tb.style.display=n?'':'none';
  b.textContent=tb.textContent=n;
}
/* fill the static filter dropdowns, keeping the current selection */
function refreshFilters(){
  const supOpts=sel=>'<option value="">All suppliers</option>'+[...DB.suppliers].sort((a,b)=>a.Name.localeCompare(b.Name))
    .map(s=>'<option value="'+esc(s.ID)+'"'+(sel===s.ID?' selected':'')+'>'+esc(s.Name)+'</option>').join('');

}

/* ============================ TODAY view =========================== */
/* inModal: inside the project window (edit / duplicate / delete; no
   project link — it's this project). inGroup: under a project heading
   in "ready to hand off" (no project link either). */
function lineRow(l,inModal,inGroup){
  const p=PROJ[l['Project ID']]||{},s=SUP[l['Supplier ID']]||{},r=rep(l['Rep ID']);
  const od=isOverdue(l),eta=l['Expected Arrival'],id=l.ID;
  let when='';
  if(l.Status==='Ordered'){
    if(eta)when=od?'<span class="pill late">'+dDiff(eta,today())+'d late · was due '+nice(eta)+'</span>':'<span class="subtle">expected '+nice(eta)+'</span>';
    else when=od?'<span class="pill late">no ETA · ordered '+dDiff(l['Date Ordered'],today())+'d ago</span>':'<span class="pill neutral">no ETA yet</span>';
  }
  if(l.Status==='Arrived'){
    const w=waitDays(l);
    when='<span class="subtle">arrived '+nice(l['Date Arrived'])+(w>0?' · waiting <span class="mono">'+w+'d</span>':'')+'</span>'+
      (l.Accuracy&&l.Accuracy!=='Correct'?' <span class="pill warn">'+esc(l.Accuracy)+'</span>':'');
  }
  if(l.Status==='Delivered')when='<span class="subtle">delivered '+nice(l['Date Delivered'])+'</span>';
  const contact=r&&r.Email?('<a href="mailto:'+esc(r.Email)+'">'+esc(r.Name||r.Email)+'</a>'):(s['Sample Dept Email']?'<a href="mailto:'+esc(s['Sample Dept Email'])+'">sample dept</a>':'');
  const proj=inModal||inGroup?'':' · <a href="#" onclick="openProject(\''+l['Project ID']+'\');return false">'+esc(p['Project Name']||'—')+'</a>';
  return '<div class="rowcard s-'+esc(l.Status)+(od?' overdue':'')+'">'+
    '<div class="grow">'+sampleTitle(l)+
    '<div class="meta">'+esc(s.Name||'—')+(contact?' · '+contact:'')+proj+' · ordered '+nice(l['Date Ordered'])+'</div></div>'+
    '<div>'+when+'</div><span class="pill '+esc(l.Status)+'">'+esc(l.Status)+'</span>'+
    (l.Status==='Ordered'?'<button class="btn sm" onclick="askAccuracy([\''+id+'\'])">'+ic('box')+' Receive</button>':'')+
    (l.Status==='Arrived'?'<button class="btn sm good" onclick="handOff([\''+id+'\'])">'+ic('check')+' Hand off</button>':'')+
    (inModal?'<button class="btn sm ghost" title="Edit" aria-label="Edit sample" onclick="editLine(\''+id+'\')">'+ic('edit')+'</button>'+
      '<button class="btn sm ghost" title="Duplicate" aria-label="Duplicate sample" onclick="duplicateLine(\''+id+'\')">'+ic('copy')+'</button>'+
      '<button class="btn sm danger" title="Delete" aria-label="Delete sample" onclick="askDelLine(\''+id+'\')">'+ic('trash')+'</button>':'')+
  '</div>';
}
/* Today's four numbers are filters, not decoration. Tapping one
   narrows the lists below to exactly the rows it counted; tapping
   again clears. A number you can't act on is just noise. */
let tFocus=null;
function setFocus(k){
  tFocus=(tFocus===k)?null:k;
  if(tFocus==='projects'){tFocus=null;show('projects');return;}
  renderToday();
  const l=document.getElementById('td-lists');
  if(l&&tFocus)l.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderToday(){
  const t=today();
  const open=DB.lines.filter(l=>l.Status==='Ordered');
  const overdue=open.filter(isOverdue);
  const arriving=open.filter(l=>!isOverdue(l)&&l['Expected Arrival']&&l['Expected Arrival']<=addDays(t,7));
  const active=DB.projects.filter(p=>p.Status==='Active');
  const k=(id,n,label,cls)=>'<button class="kpi'+(cls||'')+(tFocus===id?' on':'')+'" onclick="setFocus(\''+id+'\')">'+
    '<div class="n">'+n+'</div><div class="t">'+label+'</div></button>';
  document.getElementById('td-kpis').innerHTML=
    k('projects',active.length,'Active projects')+
    k('transit',open.length,'In transit')+
    k('overdue',overdue.length,'Overdue',overdue.length?' alert':'')+
    k('week',arriving.length,'Arriving this week');
  renderTodayLists();
}
function renderTodayLists(){
  const t=today();
  const open=DB.lines.filter(l=>l.Status==='Ordered');
  const overdue=open.filter(isOverdue);
  const ready=DB.lines.filter(l=>l.Status==='Arrived');
  const active=DB.projects.filter(p=>p.Status==='Active');
  const atRisk=active.filter(p=>p['Needed By']&&p['Needed By']<=addDays(t,CFG.riskDays)&&(LINESBYPROJ[p.ID]||[]).some(l=>l.Status==='Ordered'));
  const f=l=>{
    if(tFilter.sup&&l['Supplier ID']!==tFilter.sup)return false;
    if(tFilter.q){const q=tFilter.q.toLowerCase();const p=PROJ[l['Project ID']]||{},s=SUP[l['Supplier ID']]||{};
      if(!((l.Product||'')+' '+(l.Manufacturer||'')+' '+(l.SKU||'')+' '+(p['Project Name']||'')+' '+(s.Name||'')).toLowerCase().includes(q))return false;}
    return true;
  };
  const srt=(a,b)=>{
    if(tFilter.sort==='due')return (chaseDate(a)||'9999')<(chaseDate(b)||'9999')?-1:1;
    if(tFilter.sort==='supplier')return (SUP[a['Supplier ID']]||{Name:''}).Name.localeCompare((SUP[b['Supplier ID']]||{Name:''}).Name);
    return ((PROJ[a['Project ID']]||{})['Project Name']||'').localeCompare(((PROJ[b['Project ID']]||{})['Project Name']||''));
  };
  /* One hairline row, not a dashed box, so an empty list doesn't push
     the ones you can act on down the screen. And it says so when the
     list isn't empty, just filtered out by the search. */
  const none=(all,what,msg)=>'<div class="emptyrow">'+(all.length&&(tFilter.q||tFilter.sup)
    ?'No '+what+(tFilter.q?' match “'+esc(tFilter.q)+'”':' from this supplier')+'.':msg)+'</div>';
  let h='';
  const showSect=k=>!tFocus||tFocus===k;
  if(tFocus){
    h+='<div class="focusbar">Filtered to <b>'+
      ({overdue:'overdue',transit:'everything in transit',week:'arriving this week'}[tFocus]||tFocus)+
      '</b><button class="btn sm ghost" onclick="setFocus(null)">Clear</button></div>';
  }
  if(atRisk.length&&!tFocus){
    h+='<div class="sect"><h2>Projects at risk<span class="count hot">'+atRisk.length+'</span></h2>';
    atRisk.forEach(p=>{const pr=projProgress(p.ID);
      h+='<div class="rowcard overdue"><div class="grow"><div class="title">'+esc(p['Project Name'])+'</div><div class="meta">'+esc(p.Client||'')+' · '+esc(p.Salesperson||'')+' · '+(pr.total-pr.arrived)+' of '+pr.total+' samples still in transit</div></div>'+neededPill(p)+'<button class="btn sm" onclick="openProject(\''+p.ID+'\')">Open</button></div>';});
    h+='</div>';
  }
  const od=overdue.filter(f).sort(srt);
  if(showSect('overdue'))
    h+='<div class="sect"><h2>Overdue<span class="count'+(od.length?' hot':'')+'">'+od.length+'</span></h2>'+
      (od.length?od.map(l=>lineRow(l)).join(''):none(overdue,'overdue samples','<b>Nothing overdue.</b> The board is clean.'))+'</div>';
  const rd=ready.filter(f);
  if(rd.length&&!tFocus)h+=readyBlock(rd);
  if(showSect('week')){
    const wkAll=open.filter(l=>!isOverdue(l)&&l['Expected Arrival']&&l['Expected Arrival']<=addDays(t,7));
    const wk=wkAll.filter(f).sort(srt);
    if(tFocus==='week')h+='<div class="sect"><h2>Arriving this week<span class="count">'+wk.length+'</span></h2>'+
      (wk.length?wk.map(l=>lineRow(l)).join(''):none(wkAll,'samples arriving this week','Nothing due in the next seven days.'))+'</div>';
  }
  const arAll=open.filter(l=>!isOverdue(l));
  const ar=arAll.filter(f).sort(srt);
  if(showSect('transit')&&tFocus!=='week')
    h+='<div class="sect"><h2>In transit<span class="count">'+ar.length+'</span></h2>'+
      (ar.length?ar.map(l=>lineRow(l)).join(''):none(arAll,'samples in transit','Nothing on the way right now.'))+'</div>';
  document.getElementById('td-lists').innerHTML=h;
}
/* In the building, grouped by project — a job's samples go out
   together, so each group gets one "Hand off all". Oldest first, with
   how long each has waited: this list only helps if it stays short. */
function readyBlock(ls){
  const by={};ls.forEach(l=>(by[l['Project ID']]=by[l['Project ID']]||[]).push(l));
  const arr=l=>l['Date Arrived']||'9999';
  const groups=Object.keys(by).map(pid=>by[pid].sort((a,b)=>arr(a)<arr(b)?-1:1)).sort((a,b)=>arr(a[0])<arr(b[0])?-1:1);
  return '<div class="sect"><h2>In the building — ready to hand off<span class="count">'+ls.length+'</span></h2>'+
    groups.map(g=>{
      const pid=g[0]['Project ID'],p=PROJ[pid]||{},w=waitDays(g[0]);
      return '<div class="group"><div class="grouphead"><div class="grow">'+
          '<a href="#" onclick="openProject(\''+pid+'\');return false">'+esc(p['Project Name']||'(no project)')+'</a>'+
          '<span class="subtle"> · '+plural(g.length,'sample')+(w>0?' · oldest waiting <span class="mono">'+w+'d</span>':'')+
          (p.Status==='Complete'?' · project marked complete':'')+'</span></div>'+
          (g.length>1?'<button class="btn sm good" onclick="handOff('+esc(JSON.stringify(g.map(l=>l.ID)))+')">'+ic('check')+' Hand off all '+g.length+'</button>':'')+
        '</div>'+g.map(l=>lineRow(l,false,true)).join('')+'</div>';
    }).join('')+'</div>';
}

/* the drill-down is its own history entry: Back returns to the list */
function recvOpen(sid){rState.sup=sid;renderReceive();window.scrollTo({top:0});history.pushState({view:'receive',sup:sid},'');}
function recvBack(){

    .sort((a,b)=>(chaseDate(a)||'9999')<(chaseDate(b)||'9999')?-1:1);

    '<div class="pagehead"><h2>'+esc(s.Name)+'</h2><p>Tap each sample that is in the box.</p></div>';
  if(ls.length>1)h+='<div style="margin-bottom:14px"><button class="btn good" onclick="receiveAll()">'+ic('check')+' Everything is here &amp; correct ('+ls.length+')</button></div>';
  if(!ls.length)h+='<div class="empty"><b>All caught up.</b> Nothing left on order from '+esc(s.Name)+'.</div>';
  ls.forEach(l=>{
    const p=PROJ[l['Project ID']]||{};const od=isOverdue(l),eta=l['Expected Arrival'];
    const due=eta?(od?' · <span class="pill late">'+dDiff(eta,today())+'d late</span>':' · expected '+nice(eta))
                 :(od?' · <span class="pill late">no ETA · ordered '+dDiff(l['Date Ordered'],today())+'d ago</span>':' · no ETA yet');
    h+='<div class="rowcard recvrow s-Ordered'+(od?' overdue':'')+'">'+

      '<div class="meta">'+esc(p['Project Name']||'—')+' · ordered '+nice(l['Date Ordered'])+due+'</div></div>'+

  });
  if(receivedNow.length)h+=receivedNowBlock();

function receivedNowBlock(){
  const ls=receivedNow.map(id=>DB.lines.find(l=>l.ID===id)).filter(l=>l&&l.Status!=='Ordered');
  if(!ls.length)return'';
  return '<div class="sect" style="margin-top:26px"><h2>Received just now<span class="count">'+ls.length+'</span></h2>'+
    ls.map(l=>{const s=SUP[l['Supplier ID']]||{};const p=PROJ[l['Project ID']]||{};
      return '<div class="rowcard justnow s-Arrived"><div class="grow">'+sampleTitle(l)+
      '<div class="meta">'+esc(s.Name||'')+' · '+esc(p['Project Name']||'')+'</div></div>'+
      (l.Accuracy&&l.Accuracy!=='Correct'?'<span class="pill warn">'+esc(l.Accuracy)+'</span>':'')+
      '<span class="pill Arrived">Arrived</span></div>';}).join('')+'</div>';
}
function receiveAll(){
  const ids=DB.lines.filter(l=>l.Status==='Ordered'&&l['Supplier ID']===rState.sup).map(l=>l.ID);
  if(ids.length)commitReceive(ids,'Correct');
}
/* Ordered -> Arrived, in one request, with an Undo. It moves supplier
   scores, so a mis-tap has to be cheap to take back. */
function commitReceive(ids,acc){
  const t=today(),changes=[];
  ids.forEach(id=>{const l=DB.lines.find(x=>x.ID===id);if(!l||l.Status!=='Ordered')return;
    changes.push({kind:'line',o:l,before:{...l}});
    l.Status='Arrived';l['Date Arrived']=t;l.Accuracy=acc;
    if(!receivedNow.includes(id))receivedNow.unshift(id);});
  if(!changes.length)return;
  commit([{action:'receive',payload:{items:changes.map(c=>({id:c.o.ID,accuracy:acc}))}}]);
  toast(changes.length>1?changes.length+' samples received':'Marked arrived',{undo:()=>{
    receivedNow=receivedNow.filter(id=>!changes.some(c=>c.o.ID===id));
    undoChanges(changes,'Receive undone');
  }});
  redraw();
}

/* arrival + accuracy — shared by Today, Receive, and project modal */
function askAccuracy(ids){
  accCtx=ids;
  const l=DB.lines.find(x=>x.ID===ids[0])||{};
  const s=SUP[l['Supplier ID']]||{};
  document.getElementById('md-acc').innerHTML='<button class="close" aria-label="Close" onclick="closeOv(\'ov-acc\')">'+ic('x')+'</button>'+
    '<h2>How did it arrive?</h2><p class="subtle" style="margin-top:4px">'+esc(l.Product||'')+(s.Name?' · '+esc(s.Name):'')+' — this builds the supplier\'s accuracy rating.</p>'+
    '<div class="acc-opts">'+
    '<button class="btn good" onclick="finishArrival(\'Correct\')">'+ic('check')+' Correct &amp; complete</button>'+
    '<button class="btn warn" onclick="finishArrival(\'Incomplete\')">'+ic('half')+' Incomplete</button>'+
    '<button class="btn bad" onclick="finishArrival(\'Wrong item\')">'+ic('x')+' Wrong item</button>'+
    '<button class="btn ghost" onclick="finishArrival(\'\')">Skip — just mark arrived</button></div>';
  openOv('ov-acc');
}
function finishArrival(acc){
  const ids=accCtx;accCtx=null;
  closeOv('ov-acc',{force:true});
  if(ids)commitReceive(ids,acc);
}
/* Received -> handed off. Takes several at once (a project's whole
   pile). A project whose last sample this was is completed with it —
   all in one request, and one Undo puts the lot back. */
function handOff(ids){
  const t=today(),changes=[],ops=[],done=[];
  ids.forEach(id=>{const l=DB.lines.find(x=>x.ID===id);if(!l||l.Status!=='Arrived')return;
    const b={...l};l.Status='Delivered';l['Date Delivered']=t;
    if(!justHandedOff.includes(id))justHandedOff.push(id);
    changes.push({kind:'line',o:l,before:b});ops.push(opSave('line',l,b));});
  if(!changes.length)return;
  index();
  [...new Set(changes.map(c=>c.o['Project ID']))].forEach(pid=>{
    const p=PROJ[pid],ls=LINESBYPROJ[pid]||[];
    if(p&&p.Status==='Active'&&ls.length&&ls.every(x=>x.Status==='Delivered')){
      const b={...p};p.Status='Complete';p.Completed=t;
      changes.push({kind:'project',o:p,before:b});ops.push(opSave('project',p,b));done.push(p['Project Name']);
    }
  });
  commit(ops);
  const n=changes.length-done.length;
  toast((n>1?n+' handed off':'Handed off')+(done.length===1?' — '+done[0]+' complete':(done.length?' — '+done.length+' projects complete':'')),
    {undo:()=>undoChanges(changes,'Hand-off undone')});
  redraw();
}

/* ========================== PROJECTS view ========================== */
function renderProjectList(){
  let list=DB.projects.filter(p=>{
    if(pFilter.status!=='All'&&p.Status!==pFilter.status)return false;
    if(pFilter.sales&&p.Salesperson!==pFilter.sales)return false;
    const ls=LINESBYPROJ[p.ID]||[];
    if(pFilter.sup&&!ls.some(l=>l['Supplier ID']===pFilter.sup))return false;
    if(pFilter.q){const q=pFilter.q.toLowerCase();
      const blob=(p['Project Name']||'')+' '+(p.Client||'')+' '+ls.map(l=>(l.Product||'')+' '+(l.Manufacturer||'')+' '+(l.SKU||'')).join(' ');
      if(!blob.toLowerCase().includes(q))return false;}
    return true;
  }).sort((a,b)=>(a['Needed By']||'9999')<(b['Needed By']||'9999')?-1:1);

  let h='';
  if(!list.length){h='<div class="empty"><b>No projects here yet.</b> Start one with "New project".</div>';}
  else{
    h='<div class="grid">'+list.map(p=>{
      const pr=projProgress(p.ID);
      const sups=[...new Set((LINESBYPROJ[p.ID]||[]).map(l=>(SUP[l['Supplier ID']]||{}).Name).filter(Boolean))];
      const pct=pr.total?Math.round(pr.arrived/pr.total*100):0;
      const hasLate=(LINESBYPROJ[p.ID]||[]).some(isOverdue);
      /* a div (it holds a heading) that still works from the keyboard:
         role + tabindex here, Enter / Space in the keydown handler */
      return '<div class="pcard" role="button" tabindex="0" onclick="openProject(\''+p.ID+'\')"><h3>'+esc(p['Project Name'])+'</h3>'+
        '<div class="meta">'+esc(p.Client||'')+(p.Salesperson?' · '+esc(p.Salesperson):'')+'</div>'+
        '<div class="chips">'+neededPill(p)+(hasLate?'<span class="pill late">overdue samples</span>':'')+(p.Status==='Complete'?'<span class="pill Arrived">Complete</span>':'')+'</div>'+
        '<div class="thread"><i class="'+(pct===100?'done':'')+'" style="width:'+pct+'%"></i></div>'+
        '<div class="prog">'+pr.arrived+' of '+pr.total+' arrived · '+pr.delivered+' handed off</div>'+
        (sups.length?'<div class="meta" style="margin-top:6px">'+esc(sups.join(' · '))+'</div>':'')+'</div>';

/* The archive is a view, not a state — the rows still exist, still
   belong to the project, and still count toward the supplier's speed

function archiveBar(ls,row){

/* Everything typed in this window survives a redraw (a hand-off, a

}
function cancelProjEdit(){projEditOpen=false;renderProjectModal();}
function saveProjEdit(){

  const before={...p};

/* Samples save as you go; this saves the details editor and a sample
   being edited, then closes. A half-typed "Add a sample" is asked
   about rather than silently dropped (closeOv). */
function saveAndClose(){

/* Completing a project with samples still in the building offers to
   hand those off too — otherwise they sit on Today's hand-off list
   long after anyone is looking at the job. */
function completeProject(){
  const p=PROJ[openProjectId];if(!p)return;
  const waiting=(LINESBYPROJ[p.ID]||[]).filter(l=>l.Status==='Arrived');
  const finish=all=>{
    const t=today(),b={...p},changes=[{kind:'project',o:p,before:b}];
    p.Status='Complete';p.Completed=t;
    const ops=[opSave('project',p,b)];
    if(all)waiting.forEach(l=>{const lb={...l};l.Status='Delivered';l['Date Delivered']=t;
      if(!justHandedOff.includes(l.ID))justHandedOff.push(l.ID);
      changes.push({kind:'line',o:l,before:lb});ops.push(opSave('line',l,lb));});
    commit(ops);
    toast('Project complete'+(all?' — '+waiting.length+' handed off':''),{undo:()=>undoChanges(changes,'Project reopened')});
    renderProjectModal();
  };
  if(!waiting.length)return finish(false);
  ask({title:'Hand off the rest too?',
    text:plural(waiting.length,'sample')+' from this project '+(waiting.length>1?'are':'is')+' still in the building, waiting to be handed off. Mark '+(waiting.length>1?'them':'it')+' handed off as well?',
    ok:'Hand off & complete',alt:'Complete only'}).then(r=>{if(r)finish(r===true);});
}
function reopenProject(){const p=PROJ[openProjectId];const b={...p};p.Status='Active';p.Completed='';saveProject(p,'Project reopened',b);renderProjectModal();}
function askDelProject(){
  const p=PROJ[openProjectId];if(!p)return;
  const n=(LINESBYPROJ[p.ID]||[]).length;
  ask({title:'Delete this project?',
    text:'“'+p['Project Name']+'”'+(n?' and its '+plural(n,'sample')+' are':' is')+' removed for good'+(n?', and those samples stop counting toward supplier scores':'')+'. To put a finished job away, mark it complete instead.',
    ok:'Delete project',danger:true}).then(ok=>{
      if(!ok)return;
      removeThing('project',p.ID,'Project deleted');
      closeOv('ov-project',{force:true});
    });
}
function projDirty(){
  const p=PROJ[openProjectId],out=[];
  if(p&&projEditOpen){
    const now=['pe-name','pe-client','pe-sales','pe-needed','pe-notes'].map(val);
    const was=[p['Project Name'],p.Client,p.Salesperson,p['Needed By'],p.Notes].map(v=>String(v==null?'':v).trim());
    if(now.some((v,i)=>v!==was[i]))out.push('the project details');
  }
  if(['al-prod','al-mfr','al-sku','al-notes'].some(val))out.push('the sample you started adding');
  if(editorDirty())out.push('your edits to a sample');
  return out.length?'Not saved yet: '+out.join(', ')+'.':'';
}

/* Everything typed inside a window, by element id, so a redraw can put
   it back. Leaves out search boxes (they have their own state) and any
   id starting with one of `drop` — a form being deliberately reset. */
function grabFields(rootId,drop){
  const out={};
  document.querySelectorAll('#'+rootId+' input[id],#'+rootId+' select[id],#'+rootId+' textarea[id]').forEach(e=>{
    if(e.type==='search'||(drop||[]).some(p=>e.id.indexOf(p)===0))return;
    out[e.id]=e.value;
  });
  return out;
}
function putFields(vals){
  const ids=Object.keys(vals);
  /* suppliers first: choosing one rebuilds the rep list beneath it */
  ids.filter(id=>/-sup$/.test(id)).forEach(id=>{
    const e=document.getElementById(id);
    if(e&&e.value!==vals[id]){e.value=vals[id];e.dispatchEvent(new Event('change'));}
  });
  ids.forEach(id=>{if(/-sup$/.test(id))return;const e=document.getElementById(id);if(e&&e.value!==vals[id])e.value=vals[id];});
  ['al','np1'].forEach(p=>{if(document.getElementById(p+'-carry')){carryHint(p);updateEta(p);}});
}

function lineSupChanged(idp){
